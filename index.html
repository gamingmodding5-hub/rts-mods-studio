  if(p+46>bytes.length||view.getUint32(p,true)!==0x02014b50)throw Error('Directorio ZIP inválido.');
  const flags=view.getUint16(p+8,true),method=view.getUint16(p+10,true),crc=view.getUint32(p+16,true),compressed=view.getUint32(p+20,true),uncompressed=view.getUint32(p+24,true),nameLen=view.getUint16(p+28,true),extraLen=view.getUint16(p+30,true),commentLen=view.getUint16(p+32,true),localOffset=view.getUint32(p+42,true);
  const end=p+46+nameLen+extraLen+commentLen;if(end>bytes.length)throw Error('Entrada ZIP truncada.');
  const name=new TextDecoder().decode(bytes.slice(p+46,p+46+nameLen));p=end;
  if(name.endsWith('/'))continue;
  const safe=safePath(name),key=safe.toLowerCase();if(seen.has(key))throw Error(`Ruta duplicada dentro del paquete: ${safe}`);seen.add(key);
  if(flags&1)throw Error(`El archivo ${safe} está cifrado y no puede abrirse.`);
  if(method!==0&&method!==8)throw Error(`Compresión no compatible en ${safe}.`);
  totalUncompressed+=uncompressed;if(totalUncompressed>250*1024*1024)throw Error('El contenido descomprimido supera el límite de seguridad de 250 MB.');
  if(localOffset+30>bytes.length||view.getUint32(localOffset,true)!==0x04034b50)throw Error(`Cabecera local inválida en ${safe}.`);
  const localNameLen=view.getUint16(localOffset+26,true),localExtraLen=view.getUint16(localOffset+28,true),start=localOffset+30+localNameLen+localExtraLen;
  if(start+compressed>bytes.length||start+compressed>cdOffset)throw Error(`El contenido de ${safe} está incompleto.`);
  files.push({name:safe,method,raw:bytes.slice(start,start+compressed),uncompressed,crc});
 }
 return files;
}
async function inflateEntry(entry){
 let output;
 if(entry.method===0)output=entry.raw;
 else{
  if(typeof DecompressionStream!=='function')throw Error('Este navegador no puede descomprimir entradas DEFLATE. Usa Chrome, Edge, Firefox o Safari actualizado.');
  const ds=new DecompressionStream('deflate-raw'),reader=new Blob([entry.raw]).stream().pipeThrough(ds).getReader(),chunks=[];let total=0;
  try{while(true){const {done,value}=await reader.read();if(done)break;total+=value.length;if(total>250*1024*1024||total>entry.uncompressed)throw Error(`El archivo ${entry.name} supera el tamaño indicado en el ZIP.`);chunks.push(value)}}finally{reader.releaseLock()}
  output=concatBytes(chunks);

}
function iniToItem(text,path){const p=parseIni(text).sections,core=p.core||{},id=slug(core.name||path.split('/').pop().replace(/\.ini$/i,''));return{id,name:core.displaytext||core.displayText||id,faction:project.factions[0]?.id||'',category:'Importado',hp:num(core.maxhp,300),cost:num(String(core.price||'0').replace(/[^0-9.].*$/,''),0),mass:num(core.mass,3000),radius:num(core.radius,12),buildTime:core.buildspeed||'10s',description:core.displaydescription||'',config:text}}
async function importRwmod(file){if(file.size>100*1024*1024)throw Error('El archivo supera los 100 MB.');const bytes=new Uint8Array(await file.arrayBuffer()),files=parseZip(bytes);let modInfo='',units=[],assets=[];for(const f of files){if(f.name.endsWith('/'))continue;const safe=safePath(f.name);const content=await inflateEntry(f);if(safe.toLowerCase()==='mod-info.txt')modInfo=new TextDecoder().decode(content);else if(/^units\/.+\.ini$/i.test(safe)){const text=new TextDecoder().decode(content);units.push(iniToItem(text,safe))}else{const mime=safe.endsWith('.png')?'image/png':safe.endsWith('.jpg')||safe.endsWith('.jpeg')?'image/jpeg':safe.endsWith('.webp')?'image/webp':safe.endsWith('.ogg')?'audio/ogg':'application/octet-stream';let binary='';for(let i=0;i<content.length;i+=0x8000)binary+=String.fromCharCode(...content.subarray(i,i+0x8000));assets.push({path:safe,data:`data:${mime};base64,${btoa(binary)}`,type:mime,size:content.length})}}if(modInfo){const title=modInfo.match(/^title\s*:\s*(.*)$/im),desc=modInfo.match(/^description\s*:\s*(.*)$/im);if(title)project.meta.name=title[1].trim();if(desc)project.meta.description=desc[1].trim();project.meta.id=slug(project.meta.name)}if(!units.length)throw Error('No se encontraron INI directamente dentro de la carpeta units/.');project.units=units;project.assets=assets;scheduleSave();navigate('dashboard');notify(`Se importaron ${units.length} configuraciones y ${assets.length} recursos.`)}
// Keyboard and lifecycle safeguards.
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();saveNow().then(()=>notify('Proyecto guardado.'))}if(e.key==='Escape'){if(modal){modal=null;render()}else document.body.classList.remove('menuopen')}});
document.addEventListener('click',e=>{if(!document.body.classList.contains('menuopen'))return;const target=e.target;if(target.closest?.('.sidebar')||target.closest?.('#menu-toggle'))return;document.body.classList.remove('menuopen');const button=$('#menu-toggle');if(button){button.setAttribute('aria-expanded','false');button.setAttribute('aria-label','Abrir menú')}});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
window.addEventListener('pagehide',()=>{if(dirty&&db){try{idbSet(project)}catch{}}});
// Allow the package importer to be reached from the project page without adding a separate dependency.
window.addEventListener('dragover',e=>{if(e.dataTransfer?.types?.includes('Files'))e.preventDefault()});
boot();
})();
