<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b111a">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<meta name="description" content="rts-mods-studio: espacio de trabajo para diseñar, personalizar, organizar y preparar mods de Rusted Warfare.">
<title>RTS MODS STUDIO</title>
<style>
:root{color-scheme:dark;--bg:#0b111a;--surface:#121c29;--surface2:#172435;--surface3:#1d2c40;--line:#293a4e;--text:#eaf1fa;--muted:#91a3b8;--subtle:#687d95;--blue:#5da8ff;--blue2:#347dca;--green:#43c99d;--orange:#efb45e;--red:#fa8585;--purple:#b394ff;--radius:12px;font:14px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html{min-width:320px;background:var(--bg);scrollbar-gutter:stable;scroll-padding-top:73px}
body{margin:0;min-height:100vh;color:var(--text);background:var(--bg);overflow-x:hidden}
body.modalopen,body.menuopen{overflow:hidden}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.app{min-height:100vh}
.layout{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100dvh}
.sidebar{position:sticky;top:0;align-self:start;height:100dvh;display:flex;flex-direction:column;padding:14px 10px 12px;background:#0e1722;border-right:1px solid var(--line);z-index:20;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#3a5069 transparent}
.brand{display:flex;align-items:center;gap:9px;padding:2px 7px 14px}
.brandmark{display:grid;place-items:center;width:36px;height:36px;flex:none;border-radius:10px;background:#173b5b;border:1px solid #37678f}
.brandmark svg{width:29px;height:29px}
.brandname{font-weight:850;letter-spacing:1px;font-size:11px;line-height:1.25}
.brandname small{display:block;color:#93a9c2;font-size:8px;letter-spacing:2px;margin-top:3px}
.project-mini{display:flex;gap:10px;align-items:center;padding:9px 10px;background:var(--surface2);border:1px solid var(--line);border-radius:9px;margin:0 1px 13px;min-width:0}
.live-dot{width:8px;height:8px;flex:none;border-radius:100%;background:var(--green)}
.project-mini small,.project-mini strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.project-mini small{font-size:8px;color:var(--muted);letter-spacing:1px}
.project-mini strong{font-size:12px;margin-top:2px}
.navgroup{margin:0 0 11px}
.navlabel{padding:0 8px 5px;color:var(--subtle);font-size:8px;font-weight:800;letter-spacing:1.25px}
.navbtn{width:100%;display:flex;align-items:center;gap:9px;min-height:33px;padding:7px 8px;margin:1px 0;border:1px solid transparent;border-radius:7px;background:transparent;color:#aab9cb;text-align:left;font-size:11px}
.navbtn:hover{background:#1a293a;color:var(--text)}
.navbtn.active{background:#1a3450;border-color:#2a4e70;color:#9dcbff}
.navicon{width:16px;text-align:center;font-size:13px}
.navcount{margin-left:auto;color:#91a7c0;background:#26374a;padding:1px 6px;border-radius:20px;font-size:9px}
.main{min-width:0}
.topbar{height:53px;position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(12px,1.8vw,24px);border-bottom:1px solid #28384a;background:#0e1722}
.crumb{color:#9aabc0;font-size:10px;font-weight:800;letter-spacing:1.3px}
.crumb span{color:#4d6076;margin:0 8px}
.topright{display:flex;align-items:center;gap:8px}
.save-label{font-size:10px;color:var(--muted)}
.iconbtn,.mobile-menu{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:#c4d8ed}
.mobile-menu{display:none}
.content{width:min(1420px,100%);margin:auto;padding:clamp(13px,1.8vw,25px)}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:17px}
.eyebrow{color:var(--blue);font-size:8px;font-weight:850;letter-spacing:1.45px;margin-bottom:4px}
.pagehead h1{font-size:clamp(21px,2.5vw,28px);line-height:1.15;letter-spacing:-.8px;margin:0 0 5px;font-weight:760}
.pagehead p{margin:0;color:var(--muted);font-size:11px;line-height:1.45;max-width:760px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid #4b92d4;border-radius:7px;background:var(--blue2);color:white;min-height:34px;padding:7px 11px;font-size:10px;font-weight:750;white-space:nowrap}
.btn:hover{background:#3d8add}
.btn.secondary{background:var(--surface2);border-color:var(--line);color:#d2e1f0}
.btn.secondary:hover{background:#1d2c40}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--muted)}
.btn.ghost:hover{background:#14202d;color:var(--text)}
.btn.danger{background:#492b32;border-color:#78424c;color:#ffc0c0}
.btn.danger:hover{background:#5a333c}
.btn.small{min-height:29px;padding:5px 8px;font-size:9px}
.btn.full{width:100%}
.hero{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;min-height:135px;padding:19px 22px;border:1px solid #31587d;border-radius:11px;background:#172e46}
.hero .kicker{font-size:9px;letter-spacing:1.8px;color:#9bcaff;font-weight:850}
.hero h2{font-size:clamp(19px,2vw,23px);line-height:1.2;margin:7px 0 5px;overflow-wrap:anywhere}
.hero p{font-size:10px;color:#afc1d4;max-width:570px;margin:0 0 11px}
.hero-meta{display:flex;gap:18px;flex-wrap:wrap;color:#91a9c2;font-size:10px}
.hero-mark{width:88px;height:88px;border:1px solid #6aa2d4;border-radius:20px;display:grid;place-items:center;color:#abd2ff;font-size:32px;font-weight:850;margin-right:25px;opacity:.6}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:11px 0}
.stat,.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.stat{padding:11px}
.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:10px}
.stat-icon{width:25px;height:25px;display:grid;place-items:center;background:#1b3650;color:#8cc5ff;border-radius:7px;font-size:13px}
.stat strong{display:block;font-size:22px;margin:8px 0 1px;line-height:1.1}
.stat small{color:var(--subtle);font-size:9px}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:11px}
.panel{padding:15px;min-width:0}
.panelhead{display:flex;justify-content:space-between;align-items:center;gap:9px;margin-bottom:12px}
.panelhead h3,.panel h3{font-size:12px;margin:0 0 4px}
.panelhead p{font-size:9px;color:var(--muted);margin:0;line-height:1.4}
.quickgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.quick{display:flex;gap:8px;align-items:center;text-align:left;padding:9px;border-radius:8px;border:1px solid #2a3d52;background:#182637;color:var(--text);min-width:0}
.quick:hover{border-color:#4e82b5;background:#1b3045}
.quickicon{width:28px;height:28px;flex:none;display:grid;place-items:center;border-radius:7px;background:#24415f;color:#a3cefa}
.quick b,.quick small{display:block}
.quick b{font-size:9px}
.quick small{font-size:8px;color:var(--muted);margin-top:3px}
.quick .arrow{margin-left:auto;color:#88b7e6}
.progressrow{display:flex;justify-content:space-between;font-size:10px;color:#a7b7c8;margin:12px 0 6px}
.track{height:5px;border-radius:10px;background:#29394b;overflow:hidden}
.track i{display:block;height:100%;background:var(--blue);border-radius:10px}
.track.green i{background:var(--green)}
.track.purple i{background:var(--purple)}
.linkbtn{border:0;background:transparent;color:#84bbf5;padding:13px 0 0;font-size:10px}
.formgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(240px,.75fr);gap:11px;align-items:start}
.formpanel h3{margin-bottom:5px}
.muted{color:var(--muted);font-size:10px}
.field{display:block;margin:0 0 11px;color:#b9c7d7;font-size:9px;font-weight:700}
.field input,.field select,.field textarea,.control{display:block;width:100%;margin-top:5px;padding:8px 9px;border:1px solid #34475b;border-radius:7px;background:#0c1520;color:var(--text);font-size:10px;min-width:0;min-height:35px}
.field textarea{resize:vertical;min-height:72px;line-height:1.5}
.field small{display:block;margin-top:5px;font-size:9px;font-weight:400;color:var(--subtle);line-height:1.5}
input[type=color]{height:38px;padding:4px}
.twocol,.threecol{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.threecol{grid-template-columns:repeat(3,minmax(0,1fr))}
.info-panel{align-self:start}
.info-icon{width:31px;height:31px;display:grid;place-items:center;border-radius:8px;background:#21415f;color:#a4cefa;margin-bottom:13px}
.info-panel p{font-size:10px;color:var(--muted);line-height:1.7}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:9px;padding:12px 14px;border-bottom:1px solid var(--line)}
.toolbar b,.toolbar small{display:block}
.toolbar b{font-size:10px}
.toolbar small{font-size:8px;color:var(--muted);margin-top:3px}
.search{width:min(260px,45%);padding:8px 9px;background:#0b1520;color:var(--text);border:1px solid #33485f;border-radius:8px;font-size:9px;min-height:34px}
.tablepanel{padding:0;overflow:hidden}
.tablewrap{overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain}
table{width:100%;border-collapse:collapse;white-space:nowrap}
th{text-align:left;padding:9px 12px;color:#8094aa;font-size:8px;letter-spacing:.6px;border-bottom:1px solid var(--line)}
td{padding:9px 12px;color:#b7c5d5;font-size:9px;border-bottom:1px solid #253548}
tbody tr:last-child td{border-bottom:0}
.namecell b,.namecell small{display:block}
.namecell b{color:#e2ebf5;font-size:10px}
.namecell small{color:#778ca3;font-size:9px;margin-top:3px}
.color-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
.rowactions{text-align:right}
.rowactions button{width:27px;height:26px;border:1px solid #34485c;background:#1b2a3b;color:#d2e5f8;border-radius:6px;margin-left:4px}
.rowactions .del{color:#ffaaaa}
.empty{padding:22px 13px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:#d6e1ed;font-size:12px}
.empty p{font-size:10px}
.modalback{position:fixed;inset:0;z-index:60;background:#03070dcc;display:grid;place-items:center;padding:16px}
.modal{width:min(660px,100%);max-height:min(88dvh,820px);display:flex;flex-direction:column;background:#14202d;border:1px solid #3a5068;border-radius:10px;overflow:hidden}
.modalhead{padding:18px 21px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modalhead h2{font-size:17px;margin:0}
.modalbody{padding:18px 21px;overflow-y:auto;overscroll-behavior:contain}
.modalfoot{display:flex;justify-content:flex-end;gap:8px;padding:13px 21px;border-top:1px solid var(--line)}
.close{width:30px;height:30px;border:1px solid var(--line);border-radius:7px;background:var(--surface2);color:var(--text);font-size:19px}
.econgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.econcard{padding:17px}
.factitle{display:flex;gap:9px;align-items:center;margin-bottom:15px}
.factitle h3{font-size:13px;margin:0}
.factitle small{display:block;color:var(--muted);font-size:9px}
.note{padding:12px 14px;border:1px solid #5b4b32;background:#2b251d;border-radius:9px;color:#d7c39f;font-size:10px;line-height:1.65;margin-top:14px}
.note strong{color:#ffdaa0}
.summary3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.summary3>div{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:13px}
.summary3 strong,.summary3 span{display:block}
.summary3 strong{font-size:21px}
.summary3 span{font-size:9px;color:var(--muted)}
.issue{display:flex;gap:11px;padding:12px 0;border-top:1px solid #29394b}
.badge{height:19px;min-width:52px;display:grid;place-items:center;border-radius:5px;font-size:8px;font-weight:850}
.badge.error{background:#512a32;color:#ffb0b0}
.badge.warning{background:#4c3d25;color:#ffd18b}
.badge.info{background:#213b54;color:#a9d4ff}
.issue b{font-size:10px}
.issue p{font-size:10px;color:#aab9c9;margin:4px 0}
.issue small{font-size:9px;color:var(--subtle)}
.success{text-align:center;padding:27px;color:var(--green)}
.success strong{display:block;color:#d8f5e8}
.success p{color:var(--muted);font-size:10px}
.assetlist{display:grid;gap:8px}
.assetrow{display:flex;align-items:center;gap:9px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#142131}
.assetrow span{min-width:0;overflow-wrap:anywhere;font-size:10px}
.assetrow small{margin-left:auto;color:var(--muted);white-space:nowrap}
.assetrow button{border:1px solid var(--line);background:#202f40;color:#ffb0b0;border-radius:6px}
.exportgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.exportcard{padding:21px}
.exportcard .glyph{width:42px;height:42px;display:grid;place-items:center;border-radius:10px;background:#203b57;color:#9bcaff;font-size:20px;margin-bottom:16px}
.exportcard h2{font-size:19px;margin:8px 0}
.exportcard p{font-size:10px;color:var(--muted);line-height:1.7;min-height:55px}
.detailrow{display:flex;justify-content:space-between;padding:11px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:10px;color:var(--muted);margin:14px 0}
.detailrow b{color:var(--text)}
.toastarea{position:fixed;right:18px;bottom:18px;display:grid;gap:8px;z-index:100;pointer-events:none}
.toast{max-width:min(380px,calc(100vw - 36px));padding:11px 14px;border:1px solid #43617f;background:#182b3f;color:#e8f2fc;border-radius:9px;font-size:11px}
.toast.bad{border-color:#86515b;background:#35232b}
.toast.good{border-color:#377d68;background:#18342e}
.hidden{display:none!important}
.footnote{font-size:9px;color:var(--subtle);line-height:1.6;margin-top:15px}
.dropzone{display:grid;place-items:center;text-align:center;min-height:120px;border:1px dashed #49627b;border-radius:9px;background:#132235;padding:18px}
.dropzone strong{font-size:11px}
.dropzone span{font-size:9px;color:var(--muted)}
.dropzone.drag{border-color:var(--blue);background:#19324b}
.divider{border:0;border-top:1px solid var(--line);margin:17px 0}
.toolrow{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}
.guide-steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}
.guide-steps button{display:flex;align-items:flex-start;gap:9px;text-align:left;padding:12px;border:1px solid var(--line);border-radius:9px;background:#142235;color:var(--text);min-width:0}
.guide-steps button:hover{border-color:#5c90c2;background:#192d43}
.guide-steps i{width:24px;height:24px;flex:none;display:grid;place-items:center;border-radius:50%;background:#244768;color:#b9dcff;font-style:normal;font-weight:800;font-size:10px}
.guide-steps b,.guide-steps small{display:block}
.guide-steps b{font-size:10px}
.guide-steps small{margin-top:4px;color:var(--muted);font-size:9px;line-height:1.4}
.component-layout{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(300px,.95fr);gap:14px;align-items:start;margin-top:14px}
.component-list{display:grid;gap:9px}
.component-card{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;padding:12px;border:1px solid var(--line);border-radius:9px;background:#132131}
.component-badge{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;background:#244464;color:#b5d8ff;font-size:16px}
.component-main{min-width:0}
.component-main>b,.component-main>small{display:block}
.component-main>b{font-size:11px}
.component-main>small{font-size:9px;color:var(--muted);margin-top:3px}
.component-main p{font-size:10px;color:#aebdce;margin:6px 0 0;overflow-wrap:anywhere}
.component-actions{grid-column:2;display:flex;gap:6px;flex-wrap:wrap}
.component-actions .btn{padding:5px 8px;font-size:9px}
.helper-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 10px}
.helper-actions>span{font-size:9px;color:var(--muted)}
.assetrow-rich{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:9px;background:#142131;margin:8px 0;min-width:0}
.asset-thumb{width:44px;height:44px;flex:none;object-fit:contain;border-radius:6px;border:1px solid #344a61;background:#0b1420}
.asset-symbol{display:grid;place-items:center;color:#9bcaff;font-size:20px}
.asset-name{min-width:0;flex:1}
.asset-name b,.asset-name small{display:block;overflow-wrap:anywhere}
.asset-name b{font-size:10px}
.asset-name small{font-size:9px;color:var(--muted);margin-top:3px}
.asset-actions{display:flex;gap:5px;flex-wrap:wrap}
.asset-toolbar{margin:0 -15px}
.single-export{grid-template-columns:minmax(0,680px)}
.single-export .exportcard p{min-height:0}
.empty .btn{margin-top:10px}
.balance-table input{width:76px;min-width:62px;padding:7px 6px;border:1px solid #34475b;border-radius:6px;background:#0c1520;color:var(--text);font-size:10px}
.balance-table td:first-child{min-width:150px}
.balance-table td:first-child small{display:block;color:var(--muted);font-size:9px;margin-top:3px}
.balance-table strong{color:#9bd2ff}
.tech-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,.75fr);gap:14px;align-items:start}
.tech-list{display:grid;gap:10px}
.tech-card{display:flex;gap:10px;align-items:flex-start;padding:13px;border:1px solid #2c4056;border-radius:9px;background:#172536}
.tech-node{width:32px;height:32px;flex:none;display:grid;place-items:center;border-radius:50%;background:#45366c;color:#d7c5ff;font-size:17px}
.tech-content{min-width:0;flex:1}
.tech-content b,.tech-content small{display:block}
.tech-content small{font-size:9px;color:var(--muted);margin-top:3px}
.tech-content p{font-size:10px;color:#b5c5d5;margin:7px 0}
.tech-card .component-actions{display:flex;gap:5px;flex-wrap:wrap}
.btn.active{background:#254a6c;border-color:#5796cf;color:white}
.pagehead p{max-width:760px;line-height:1.6}
.faq-item{padding:12px 0;border-bottom:1px solid var(--line)}
.faq-item:last-of-type{border-bottom:0;margin-bottom:14px}
.faq-item b{font-size:11px}
.faq-item p{font-size:10px;color:var(--muted);line-height:1.7;margin:5px 0 0}
.welcome-screen{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:28px 18px;background:var(--bg)}
.welcome-card{width:min(760px,100%);text-align:center;padding:clamp(28px,6vw,64px) clamp(20px,5vw,58px);border:1px solid #355574;border-radius:22px;background:#17283a}
.welcome-logo{width:104px;height:104px;margin:0 auto 24px;padding:15px;display:grid;place-items:center;border-radius:25px;background:#173b5b;border:1px solid #477da8}
.welcome-logo svg{width:100%;height:100%;display:block}
.welcome-kicker{color:#91c8ff;font-size:10px;font-weight:850;letter-spacing:2.8px;text-transform:uppercase}
.welcome-title{margin:12px 0 10px;color:#f0f6ff;font-size:clamp(25px,5vw,39px);font-weight:850;letter-spacing:1.5px;line-height:1.15}
.welcome-subtitle{margin:0 auto;max-width:520px;color:#a9bbcf;font-size:14px;line-height:1.75}
.welcome-features{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:27px 0 30px}
.welcome-features span{padding:7px 11px;border:1px solid #304a64;border-radius:30px;background:#172a3e;color:#b7cde3;font-size:10px}
.welcome-enter{min-width:190px;padding:13px 22px;border:1px solid #69a9e6;border-radius:9px;background:#347dca;color:white;font-size:12px;font-weight:800;letter-spacing:.3px}
.welcome-enter:hover{background:#3d8add}
.welcome-foot{margin-top:22px;color:#7289a2;font-size:10px}
@media(max-width:1100px){.layout{grid-template-columns:205px minmax(0,1fr)}.content{padding:17px}.sidebar{padding-inline:9px}.navbtn{font-size:10px}.econgrid{grid-template-columns:1fr 1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.guide-steps{grid-template-columns:repeat(3,minmax(0,1fr))}.component-layout{grid-template-columns:1fr}}

<body>
<div id="app" class="app" aria-live="off"></div>
<div id="toasts" class="toastarea" aria-live="polite" aria-atomic="true"></div>
<script>
'use strict';
(() => {
const APP_KEY='rms_project_v2', DB_NAME='RustedModStudioDB', DB_STORE='projects';
const ENTERED_KEY='rms_entered_workspace_v1';
const SCHEMA=5;
const MAX_FACTIONS=50,MAX_UNITS=5000,MAX_BUILDINGS=5000,MAX_ASSETS=2000,MAX_COMPONENTS=2000,MAX_TECHNOLOGIES=500,MAX_TEXT=10000;
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=v=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9_]+/g,'_').replace(/^_+|_+$/g,'').slice(0,48);
const num=(v,d=0)=>Number.isFinite(Number(v))?Number(v):d;
const clampText=(v,max=MAX_TEXT)=>String(v??'').slice(0,max);
const humanBytes=n=>n<1024?`${n} B`:n<1048576?`${(n/1024).toFixed(1)} KB`:`${(n/1048576).toFixed(1)} MB`;
const clone=x=>JSON.parse(JSON.stringify(x));
const safeColor=c=>/^#[0-9a-f]{6}$/i.test(String(c||''))?c:'#5da8ff';
const debounce=(fn,ms=120)=>{let t;return (...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}};
const starter=()=>({
  schema:SCHEMA,
  meta:{name:'Mi primer mod',id:'mi_primer_mod',version:'1.0',author:'Creador',description:'Proyecto creado con rts-mods-studio.'},
  factions:[
    {id:'industria',name:'Industria',color:'#4f9bff',description:'Producción y logística.',startingCredits:1200,income:8,buildSpeed:1,strengths:'Economía y desarrollo',weaknesses:'Costes de expansión elevados'},
    {id:'defensa',name:'Defensa',color:'#43c59e',description:'Resistencia y protección.',startingCredits:1000,income:7,buildSpeed:.9,strengths:'Protección y durabilidad',weaknesses:'Crecimiento más lento'},
    {id:'tecnologia',name:'Tecnología',color:'#b18cff',description:'Investigación y desarrollo.',startingCredits:900,income:6,buildSpeed:1.1,strengths:'Innovación y eficiencia',weaknesses:'Recursos iniciales limitados'}
  ],
  units:[{id:'trabajador',name:'Trabajador',faction:'industria',category:'Constructor',hp:220,cost:150,mass:3000,radius:10,buildTime:'8s',description:'Unidad básica de construcción.',damage:0,reload:1,range:0,speed:1,isBuilding:false,config:''}],
  buildings:[{id:'centro_civico',name:'Centro cívico',faction:'industria',category:'Centro',hp:1800,cost:900,mass:10000,radius:20,buildTime:'35s',description:'Centro administrativo de la nación.',incomePerMinute:0,buildRadius:0,isBuilding:true,config:''}],
  assets:[],components:[],technologies:[]
});
let project=starter(), tab='dashboard', modal=null, storageMode='Iniciando…', saveTimer=0, dirty=false, filter='', componentEditingId=null;
let enteredWorkspace=false;
try{enteredWorkspace=localStorage.getItem(ENTERED_KEY)==='1'}catch{}
let db=null, technologyEditingId='';

window.addEventListener('error',e=>{console.error('[rts-mods-studio]',e.error||e.message)});
window.addEventListener('unhandledrejection',e=>{console.error('[rts-mods-studio] promesa rechazada',e.reason)});

function notify(message,type='good'){
  const container=$('#toasts');
  if(!container)return;
  const el=document.createElement('div');
  el.className=`toast ${type==='bad'?'bad':type==='good'?'good':''}`;
  el.textContent=String(message).slice(0,400);
  container.append(el);
  setTimeout(()=>{try{el.remove()}catch{}},3600)
}
function setStorageLabel(text){storageMode=text;const e=$('#storage-label');if(e)e.textContent=text}
function openDB(){
  return new Promise((resolve,reject)=>{
    if(!('indexedDB'in window)){reject(Error('IndexedDB no disponible'));return}
    let settled=false;
    const timer=setTimeout(()=>{if(settled)return;settled=true;reject(Error('IndexedDB no respondió a tiempo'))},5000);
    try{
      const req=indexedDB.open(DB_NAME,1);
      req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains(DB_STORE))d.createObjectStore(DB_STORE)};
      req.onsuccess=()=>{if(settled)return;settled=true;clearTimeout(timer);resolve(req.result)};
      req.onerror=()=>{if(settled)return;settled=true;clearTimeout(timer);reject(req.error||Error('No se pudo abrir IndexedDB'))};
      req.onblocked=()=>{if(settled)return;settled=true;clearTimeout(timer);reject(Error('IndexedDB bloqueado por otra pestaña'))}
    }catch(e){clearTimeout(timer);reject(e)}
  })
}
function idbGet(){return new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,'readonly'),r=tx.objectStore(DB_STORE).get(APP_KEY);r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error)})}
function idbSet(data){return new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).put(data,APP_KEY);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||Error('Error guardando'))})}
function migrateProject(raw){
  if(!raw||typeof raw!=='object')return raw;
  if(!raw.schema||raw.schema<SCHEMA){
    delete raw.sprites;delete raw.maps;delete raw.tmxMaps;
    raw.schema=SCHEMA;
  }
  return raw;
}
function normalizeProject(raw){
  if(!raw||typeof raw!=='object')throw Error('El archivo no contiene un proyecto válido.');
  try{raw=migrateProject(raw)}catch{}
  const base=starter();
  const meta=raw.meta&&typeof raw.meta==='object'?raw.meta:{};
  const p={
    schema:SCHEMA,
    meta:{
      name:clampText(meta.name||base.meta.name,80),
      id:slug(meta.id||meta.name||base.meta.id),
      version:clampText(meta.version||base.meta.version,24),
      author:clampText(meta.author||base.meta.author,70),
      description:clampText(meta.description||'',600)
    },
    factions:Array.isArray(raw.factions)?raw.factions.slice(0,MAX_FACTIONS):base.factions,
    units:Array.isArray(raw.units)?raw.units.slice(0,MAX_UNITS):[],
    buildings:Array.isArray(raw.buildings)?raw.buildings.slice(0,MAX_BUILDINGS):[],
    assets:Array.isArray(raw.assets)?raw.assets.slice(0,MAX_ASSETS):[],
    components:Array.isArray(raw.components)?raw.components.slice(0,MAX_COMPONENTS):[],
    technologies:Array.isArray(raw.technologies)?raw.technologies.slice(0,MAX_TECHNOLOGIES):[]
  };
  for(const k of ['factions','units','buildings'])p[k]=p[k].map(x=>({...x,id:slug(x.id||x.name),name:clampText(x.name||x.id||'Sin nombre',80)}));
  p.factions=p.factions.map(f=>({...f,color:safeColor(f.color)}));
  p.units=p.units.map(u=>({...u,isBuilding:false,config:clampText(u.config)}));
  p.buildings=p.buildings.map(b=>({...b,isBuilding:true,config:clampText(b.config)}));
  p.assets=p.assets
    .filter(a=>a&&typeof a.path==='string'&&typeof a.data==='string'&&a.data.startsWith('data:'))
    .map(a=>{try{return{path:safePath(a.path),data:a.data,type:String(a.type||'application/octet-stream').slice(0,80),size:num(a.size,0)}}catch{return null}})
    .filter(Boolean);
  p.components=p.components.filter(x=>x&&typeof x==='object').map(x=>({...x,id:slug(x.id||x.name),name:clampText(x.name||x.id||'Componente',80),kind:['weapon','ability','upgrade','snippet'].includes(x.kind)?x.kind:'snippet',target:String(x.target||''),description:clampText(x.description,600),config:clampText(x.config)}));
  p.technologies=p.technologies.filter(t=>t&&typeof t==='object').map(t=>({...t,id:slug(t.id||t.name),name:clampText(t.name||t.id||'Mejora',80),target:String(t.target||''),prerequisite:String(t.prerequisite||''),cost:num(t.cost),researchTime:num(t.researchTime),effect:clampText(t.effect,600),config:clampText(t.config)}));
  return p
}
async function boot(){
  try{
    db=await openDB();
    const saved=await idbGet();
    if(saved)project=normalizeProject(saved);
    else{
      const legacy=localStorage.getItem(APP_KEY);
      if(legacy){project=normalizeProject(JSON.parse(legacy));await idbSet(project)}
    }
    setStorageLabel('Guardado local · IndexedDB');
  }catch(e){
    console.warn('[boot]',e);
    try{
      const old=localStorage.getItem(APP_KEY);
      if(old)project=normalizeProject(JSON.parse(old));
      setStorageLabel('Guardado local · respaldo');
    }catch{
      setStorageLabel('Solo sesión');
      project=starter();
    }
  }
  render();
}
function scheduleSave(){dirty=true;setStorageLabel('Cambios pendientes…');clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,450)}
async function saveNow(){
  clearTimeout(saveTimer);
  for(let attempt=0;attempt<2;attempt++){
    try{
      if(db)await idbSet(project);
      else localStorage.setItem(APP_KEY,JSON.stringify(project));
      dirty=false;setStorageLabel('Guardado local');
      return true;
    }catch(e){
      if(attempt===0){await new Promise(r=>setTimeout(r,100));continue}
    }
  }
  try{
    localStorage.setItem(APP_KEY,JSON.stringify(project));
    dirty=false;setStorageLabel('Guardado · respaldo local');
    notify('El almacenamiento principal falló; se usó el respaldo local.','bad');
    return true;
  }catch{
    setStorageLabel('No se pudo guardar');
    notify('No se pudo guardar. Libera espacio del navegador y vuelve a intentarlo.','bad');
    return false;
  }
}
function tabName(t){
  return({dashboard:'Inicio',help:'Guía y ayuda',project:'Datos del mod',units:'Unidades',buildings:'Edificios y bases',factions:'Facciones',economy:'Economía',balance:'Balance de unidades',assets:'Archivos y recursos',technologies:'Árbol de mejoras',components:'Armas y habilidades',validator:'Revisión del mod',export:'Preparar archivo'})[t]||'Inicio'
}
const navItem=(id,ico,label,count)=>`<button class="navbtn ${tab===id?'active':''}" data-tab="${id}" ${tab===id?'aria-current="page"':''}><span class="navicon">${ico}</span><span>${label}</span>${count!==undefined?`<span class="navcount">${count}</span>`:''}</button>`;
function welcomePage(){
  return `<main class="welcome-screen"><section class="welcome-card" aria-labelledby="welcome-title">
    <div class="welcome-logo"><svg viewBox="0 0 64 64" role="img" aria-label="Logotipo RTS-MODS-STUDIO" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="rtsLogoGradient" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8bd0ff"/><stop offset="1" stop-color="#347dca"/></linearGradient></defs><path d="M8 15h13l11 16 11-16h13v34H44V34L32 49 20 34v15H8z" fill="url(#rtsLogoGradient)"/><path d="M25 15h14L32 26z" fill="#eaf5ff" opacity=".8"/></svg></div>
    <div class="welcome-kicker">Plataforma de creación y edición</div>

}

    enteredWorkspace=true;
    try{localStorage.setItem(ENTERED_KEY,'1')}catch{}
    render()
  })

function shell(body){
  return `<div class="layout"><aside class="sidebar" aria-label="Navegación principal">
    <div class="project-mini"><i class="live-dot"></i><div style="min-width:0"><small>PROYECTO ACTIVO</small><strong>${esc(project.meta.name)}</strong></div></div>
    <nav>
      <div class="navgroup"><div class="navlabel">ESPACIO DE TRABAJO</div>${navItem('dashboard','▦','Resumen')}${navItem('help','?','Guía y ayuda')}${navItem('project','▤','Datos del mod')}</div>
      <div class="navgroup"><div class="navlabel">DISEÑO DEL MOD</div>${navItem('units','◈','Unidades',project.units.length)}${navItem('buildings','▥','Edificios y bases',project.buildings.length)}${navItem('factions','⬡','Facciones',project.factions.length)}${navItem('economy','⌁','Economía')}${navItem('balance','◫','Balance de unidades')}${navItem('assets','▧','Archivos y recursos',project.assets.length)}${navItem('technologies','✦','Árbol de mejoras',project.technologies.length)}${navItem('components','⚙','Armas y habilidades',project.components.length)}</div>
      <div class="navgroup"><div class="navlabel">REVISAR Y COMPARTIR</div>${navItem('validator','✓','Revisar el mod')}${navItem('export','⇧','Preparar archivo')}</div>
    </nav>
  </aside><main class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:10px"><button class="mobile-menu" id="menu-toggle" aria-label="Abrir menú" aria-expanded="false">☰</button><div class="crumb">${esc(tabName(tab).toUpperCase())}</div></div>
      <div class="topright"><span class="save-label" id="storage-label">${dirty?'Guardando cambios…':'Guardado en este dispositivo'}</span><button class="iconbtn" id="quick-save" title="Guardar ahora (Ctrl+S)" aria-label="Guardar ahora">✓</button><button class="iconbtn" id="quick-build" title="Crear paquete .rwmod" aria-label="Crear paquete .rwmod">⇩</button></div>
    </header>
    <section class="content" id="view">${body}</section>
  </main></div>${modal?renderModal():''}`
}
function pageHead(kicker,title,desc,button=''){return `<div class="pagehead"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${desc}</p></div>${button}</div>`}
function stat(label,value,icon,caption){return `<div class="stat"><div class="stat-top"><span>${label}</span><span class="stat-icon">${icon}</span></div><strong>${value}</strong><small>${caption}</small></div>`}
function dashboard(){
  const issues=validate();
  return `${pageHead('INICIO','Panel de tu mod','Crea las partes de tu mod paso a paso. Tu trabajo se guarda automáticamente en este navegador.','<button class="btn" data-tab="project">Configurar mi mod</button>')}
    <div class="hero"><div><div class="kicker">PROYECTO ACTUAL</div><h2>${esc(project.meta.name)}</h2><p>${esc(project.meta.description||'Añade una descripción en «Tu proyecto».')}</p><div class="hero-meta"><span>Versión ${esc(project.meta.version)}</span><span>Autor: ${esc(project.meta.author)}</span><span>${project.assets.length} archivos</span></div></div><div class="hero-mark" aria-hidden="true">R</div></div>
    <div class="stats">${stat('Unidades',project.units.length,'◈','Personajes y vehículos')}${stat('Edificios',project.buildings.length,'▥','Bases y estructuras')}${stat('Facciones',project.factions.length,'⬡','Equipos o naciones')}${stat('Avisos',issues.length,'✓',issues.length?'Hay detalles para revisar':'Sin avisos básicos')}</div>
    <div class="panel"><div class="panelhead"><div><h3>Empieza por aquí</h3><p>No necesitas completar todo de una vez. Puedes avanzar a tu ritmo.</p></div></div>
      <div class="guide-steps">
        <button data-tab="project"><i>1</i><span><b>Identifica tu mod</b><small>Escribe su nombre, versión y descripción.</small></span></button>
        <button data-tab="factions"><i>2</i><span><b>Crea tus facciones</b><small>Define sus colores, recursos y especialidades.</small></span></button>
        <button data-tab="units"><i>3</i><span><b>Añade unidades y edificios</b><small>Personaliza salud, coste, construcción y configuración.</small></span></button>
        <button data-tab="components"><i>4</i><span><b>Diseña armas y habilidades</b><small>Guarda fragmentos reutilizables.</small></span></button>
        <button data-tab="technologies"><i>5</i><span><b>Planifica mejoras</b><small>Construye el árbol tecnológico.</small></span></button>
        <button data-tab="validator"><i>6</i><span><b>Revisa y prepara el mod</b><small>Busca problemas y prepara el paquete .rwmod.</small></span></button>
      </div>
    </div>
    <div class="grid2" style="margin-top:14px">
      <div class="panel"><div class="panelhead"><div><h3>Accesos rápidos</h3><p>Abre directamente una herramienta.</p></div></div><div class="quickgrid">${[['◈','Crear unidad','Salud, coste y estadísticas','units'],['▥','Crear edificio','Bases, servicios y defensas','buildings'],['⬡','Editar facciones','Colores y especialidades','factions'],['⚙','Armas y habilidades','Fragmentos reutilizables','components'],['✦','Crear mejora','Planifica tecnologías','technologies'],['✓','Revisar el mod','Comprueba el proyecto','validator']].map(x=>`<button class="quick" data-action="new-${x[3]}"><span class="quickicon">${x[0]}</span><span><b>${x[1]}</b><small>${x[2]}</small></span><i class="arrow">↗</i></button>`).join('')}</div></div>
      <div class="panel"><div class="panelhead"><div><h3>Contenido actual</h3><p>Elementos que ya has añadido.</p></div></div>${[['Unidades',project.units.length,''],['Edificios',project.buildings.length,'green'],['Facciones',project.factions.length,'purple'],['Componentes',project.components.length,'']].map(x=>`<div class="progressrow"><span>${x[0]}</span><b>${x[1]}</b></div><div class="track ${x[2]}"><i style="width:${Math.min(100,x[1]*12)}%"></i></div>`).join('')}<div class="toolrow"><button class="linkbtn" data-tab="balance">Comparar unidades →</button><button class="linkbtn" data-tab="validator">Revisar el proyecto →</button></div></div>
    </div>`
}
function projectPage(){
  return `${pageHead('CONFIGURACIÓN','Datos del mod','Ponle nombre a tu creación y completa sus datos básicos. Se guardan automáticamente en este dispositivo.','<button class="btn" id="save-meta">Guardar cambios</button>')}
    <div class="formgrid">

function parseIni(text){
  const sections={},dups=[],keys=[];
  let section='';
  for(const [idx,raw] of String(text||'').split(/\r?\n/).entries()){
    const line=raw.trim();
    if(!line||line.startsWith('#')||line.startsWith(';'))continue;
    const sm=line.match(/^\[([^\]]+)\]$/);
    if(sm){
      section=sm[1].trim().toLowerCase();
      if(sections[section])dups.push(`Sección duplicada [${section}] (línea ${idx+1}).`);
      sections[section]??={};
      continue
    }
    const m=line.match(/^([^:=]+)\s*[:=]\s*(.*)$/);
    if(m&&section){
      const key=m[1].trim().toLowerCase();
      if(Object.prototype.hasOwnProperty.call(sections[section],key))dups.push(`Clave duplicada ${key} en [${section}] (línea ${idx+1}).`);
      sections[section][key]=m[2].trim();
      keys.push(`${section}.${key}`)
    }
  }
  return{sections,dups,keys}
}
function validate(){
  const issues=[],all=[...project.units.map(x=>({...x,_type:'unidad'})),...project.buildings.map(x=>({...x,_type:'edificio'})),...project.factions.map(x=>({...x,_type:'facción'}))],ids=new Map();
  for(const x of all){
    if(!x.id)issues.push(['error',x.name,'Falta el identificador interno.']);
    else if(ids.has(x.id.toLowerCase()))issues.push(['error',x.name,`ID duplicado; también aparece en ${ids.get(x.id.toLowerCase())}.`]);
    else ids.set(x.id.toLowerCase(),x._type);
    if(!String(x.name||'').trim())issues.push(['error',x.id,'Falta el nombre visible.'])
  }
  if(!project.meta.name.trim())issues.push(['error','Metadatos','El proyecto no tiene nombre.']);
  if(!/^[a-z0-9_]+$/i.test(project.meta.id))issues.push(['error','Metadatos','El ID del proyecto solo puede contener letras, números y guion bajo.']);
  for(const x of [...project.units,...project.buildings]){
    if(!project.factions.some(f=>f.id===x.faction))issues.push(['error',x.name,`La facción ${x.faction||'(vacía)'} no existe.`]);
    if(num(x.hp)<=0)issues.push(['error',x.name,'La salud debe ser mayor que cero.']);
    if(num(x.cost)<0)issues.push(['error',x.name,'El coste no puede ser negativo.']);
    if(!String(x.config||'').trim()){issues.push(['warning',x.name,'No hay configuración INI nativa; se generará una plantilla mínima.']);continue}
    const p=parseIni(x.config);
    if(!p.sections.core)issues.push(['error',x.name,'La configuración no contiene la sección [core].']);
    else{
      for(const k of ['name','maxhp','price','mass','radius'])if(!(k in p.sections.core))issues.push(['warning',x.name,`Falta la clave [core] ${k}.`]);
      if(p.sections.core.name&&p.sections.core.name!==x.id)issues.push(['warning',x.name,`El name del INI (${p.sections.core.name}) no coincide con el ID ${x.id}.`])
    }
    for(const d of p.dups)issues.push(['error',x.name,d]);
    if(!p.sections.graphics)issues.push(['warning',x.name,'No se detecta [graphics]; revisa la imagen y su ruta.']);
    if(!x.isBuilding&&!p.sections.movement)issues.push(['warning',x.name,'No se detecta [movement]; revisa el tipo y velocidad de movimiento.']);
    const image=p.sections.graphics?.image;
    if(image&&!/^\s*(SHARED:|ROOT:)/i.test(image)){
      try{
        const safe=safePath(image.replace(/^[./]+/,''));
        if(!project.assets.some(a=>a.path.toLowerCase()===safe.toLowerCase()))issues.push(['warning',x.name,`No se adjuntó el recurso de imagen: ${image}.`])
      }catch{}
    }
  }
  if(!project.factions.length)issues.push(['warning','Facciones','El proyecto no tiene facciones.']);
  if(!project.units.length)issues.push(['warning','Unidades','El proyecto no tiene unidades.']);
  if(!project.buildings.length)issues.push(['info','Edificios','Todavía no has creado edificios.']);
  for(const t of project.technologies){
    if(t.prerequisite&&!project.technologies.some(x=>x.id===t.prerequisite))issues.push(['error',t.name,'La mejora previa seleccionada ya no existe.']);
    let prereq=t.prerequisite,seen=new Set([t.id]);
    while(prereq){
      if(seen.has(prereq)){issues.push(['error',t.name,'Hay un ciclo de requisitos en el árbol de mejoras.']);break}
      seen.add(prereq);
      prereq=project.technologies.find(x=>x.id===prereq)?.prerequisite||''
    }
    if(t.target&&!([...project.units,...project.buildings].some(x=>x.id===t.target)))issues.push(['warning',t.name,'El elemento relacionado ya no existe.'])
  }
  return issues
}

  scheduleSave();render();notify('Datos del proyecto actualizados.')
}

    const f=project.factions.find(x=>x.id===i.dataset.econ);
    if(f)f[i.dataset.field]=['startingCredits','income','buildSpeed'].includes(i.dataset.field)?num(i.value):i.value
  });

function openEditor(type,id){
  if(!['units','buildings','factions'].includes(type))return;

  modal={type,id,old:old?clone(old):null};
  document.body.classList.add('modalopen');

}
function defaults(type){
  if(type==='factions')return{id:'',name:'',color:'#5da8ff',description:'',startingCredits:1000,income:5,buildSpeed:1,strengths:'',weaknesses:''};
  return{id:'',name:'',faction:project.factions[0]?.id||'',category:type==='units'?'Apoyo':'Servicio',hp:300,cost:200,mass:3000,radius:12,buildTime:'10s',description:'',damage:0,reload:1,range:0,speed:1.2,isBuilding:type==='buildings',config:''};
}
function generatedIni(x,type){
  const isBuilding=type==='buildings'||x.isBuilding===true;
  const id=x.id||'new_unit';
  const lines=[
    '[core]',
    `name: ${id}`,
    `displayText: ${String(x.name||'New unit').replace(/\r?\n/g,' ')}`,
    `displayDescription: ${String(x.description||'').replace(/\r?\n/g,' ')}`,
    `price: ${num(x.cost,100)}`,
    `maxHp: ${num(x.hp,300)}`,
    `mass: ${num(x.mass,3000)}`,
    `radius: ${num(x.radius,12)}`,
    `buildSpeed: ${x.buildTime||'10s'}`,
    `isBuilding: ${isBuilding?'true':'false'}`,
    '',
    '[graphics]',
    `image: sprites/${slug(id)||'unidad'}.png`,
    ''
  ];
  if(!isBuilding){
    lines.push('[movement]','type: land',`speed: ${num(x.speed,1.2)}`,'turnSpeed: 2','','[attack]',`damage: ${num(x.damage,0)}`,`reload: ${num(x.reload,1)}`,`range: ${num(x.range,0)}`,'');
  }
  return lines.join('\n')
}
function saveTechnology(){
  const form=$('#tech-form');
  if(!form||!form.reportValidity())return;
  const d=Object.fromEntries(new FormData(form));
  d.id=slug(d.id);d.cost=num(d.cost);d.researchTime=num(d.researchTime);
  if(d.id===d.prerequisite){notify('Una mejora no puede depender de sí misma.','bad');return}
  if(project.technologies.some(t=>t.id===d.id&&t.id!==technologyEditingId)){notify('Ya existe una mejora con ese identificador.','bad');return}
  const old=project.technologies.findIndex(t=>t.id===technologyEditingId);
  if(old>=0){
    const oldId=project.technologies[old].id;
    project.technologies[old]=d;
    if(oldId!==d.id)project.technologies.forEach(t=>{if(t.prerequisite===oldId)t.prerequisite=d.id})
  }else project.technologies.push(d);
  technologyEditingId=d.id;
  scheduleSave();render();notify('Mejora guardada.')
}
function applyTechnology(id){
  const t=project.technologies.find(x=>x.id===id);
  if(!t||!t.config||!t.target){notify('Completa el fragmento INI y selecciona un elemento relacionado.','bad');return}
  const target=[...project.units,...project.buildings].find(x=>x.id===t.target);
  if(!target){notify('El elemento relacionado ya no existe.','bad');return}
  if(String(target.config||'').includes(t.config)){notify('Este fragmento ya está incluido.','bad');return}
  target.config=(String(target.config||'').trim()+'\n\n# Mejora planificada: '+t.name+'\n'+t.config.trim()+'\n').trim()+'\n';
  scheduleSave();notify('Fragmento insertado. Revisa la configuración antes de probar el mod.')
}
function saveComponent(apply=false){
  const form=$('#component-form');
  if(!form||!form.reportValidity())return;
  const d=Object.fromEntries(new FormData(form));
  d.id=slug(d.id);
  d.kind=['weapon','ability','upgrade','snippet'].includes(d.kind)?d.kind:'snippet';
  if(!d.id){notify('El identificador no es válido.','bad');return}
  if(project.components.some(c=>c.id.toLowerCase()===d.id.toLowerCase()&&c.id!==componentEditingId)){notify('Ya existe un componente con ese identificador.','bad');return}
  const idx=project.components.findIndex(c=>c.id===componentEditingId);
  if(idx>=0)project.components[idx]=d;
  else project.components.push(d);
  componentEditingId=d.id;
  if(apply){
    if(!d.target){
      scheduleSave();render();
      notify('Componente guardado. Elige una unidad o edificio para insertarlo.','bad');
      return;
    }
    const result=applyComponent(d.id,true);
    scheduleSave();render();
    if(result==='ok')notify(`«${d.name}» se guardó e insertó en el destino.`);
    else if(result==='already')notify(`Componente guardado. El fragmento ya estaba en el INI.`);
    else notify('Componente guardado en la biblioteca.');
    return;
  }
  scheduleSave();render();notify('Componente guardado en tu biblioteca.')
}
function applyComponent(id,quiet=false){
  const c=project.components.find(x=>x.id===id);
  if(!c)return'no-component';
  const target=[...project.units,...project.buildings].find(x=>x.id===c.target);
  if(!target){if(!quiet)notify('Edita el componente y selecciona una unidad o edificio.','bad');return'no-target'}
  const fragment=String(c.config||'').trim();
  if(!fragment){if(!quiet)notify('El componente no tiene contenido para insertar.','bad');return'empty'}
  const old=String(target.config||'').trim();
  if(old.includes(fragment)){if(!quiet)notify('Este fragmento ya está en la configuración del elemento.','bad');return'already'}
  target.config=(old?old+'\n\n':'')+`# Componente insertado: ${c.name}\n`+fragment+'\n';
  scheduleSave();
  if(!quiet){render();notify(`«${c.name}» se insertó en ${target.name}. Revisa el INI antes de probarlo.`)}
  return'ok'
}
function deleteComponent(id){
  const c=project.components.find(x=>x.id===id);
  if(!c)return;
  if(!confirm(`¿Eliminar «${c.name}» de tu biblioteca? Los fragmentos ya insertados en otros INI no se borrarán.`))return;
  project.components=project.components.filter(x=>x.id!==id);
  if(componentEditingId===id)componentEditingId=null;
  scheduleSave();render();notify('Componente eliminado de la biblioteca.')
}

function trapFocus(root){
  if(!root)return()=>{};
  const focusables=()=>$$('a[href],button:not([disabled]),input:not([disabled]):not([type="hidden"]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])',root).filter(el=>el.offsetParent!==null);
  const handler=e=>{
    if(e.key!=='Tab')return;
    const list=focusables();
    if(!list.length)return;
    const first=list[0],last=list[list.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
  };
  root.addEventListener('keydown',handler);
  return()=>root.removeEventListener('keydown',handler)
}

function safePath(path){

}
async function addAssets(fileList){
  const files=Array.from(fileList||[]);
  if(!files.length)return;
  let added=0;
  for(const file of files){
    if(file.size>25*1024*1024){notify(`${file.name}: supera el límite de 25 MB.`,'bad');continue}
    let path;
    try{path=safePath(file.webkitRelativePath||file.name)}catch(err){notify(`${file.name}: ${err.message}`,'bad');continue}
    if(project.assets.some(a=>a.path.toLowerCase()===path.toLowerCase())){notify(`${path}: ya existe en la biblioteca.`,'bad');continue}
    const total=project.assets.reduce((n,a)=>n+num(a.size),0);
    if(total+file.size>200*1024*1024){notify('La biblioteca alcanzó el límite recomendado de 200 MB.','bad');break}
    try{
      const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(file)});
      project.assets.push({path,data,type:file.type||'application/octet-stream',size:file.size});
      added++
    }catch(err){notify(`No se pudo leer ${file.name}.`,'bad')}
  }
  if(added){scheduleSave();render();notify(`${added} archivo(s) añadido(s).`)}
  if($('#asset-files'))$('#asset-files').value='';
  if($('#asset-folder-files'))$('#asset-folder-files').value=''
}

}

  for(let n=0;n<count;n++){
    if(p+46>bytes.length||view.getUint32(p,true)!==0x02014b50)throw Error('Directorio ZIP inválido.');
    const flags=view.getUint16(p+8,true),method=view.getUint16(p+10,true),crc=view.getUint32(p+16,true),compressed=view.getUint32(p+20,true),uncompressed=view.getUint32(p+24,true),nameLen=view.getUint16(p+28,true),extraLen=view.getUint16(p+30,true),commentLen=view.getUint16(p+32,true),localOffset=view.getUint32(p+42,true);
    const end=p+46+nameLen+extraLen+commentLen;
    if(end>bytes.length)throw Error('Entrada ZIP truncada.');
    const name=new TextDecoder().decode(bytes.slice(p+46,p+46+nameLen));p=end;
    if(name.endsWith('/'))continue;
    const safe=safePath(name),key=safe.toLowerCase();
    if(seen.has(key))throw Error(`Ruta duplicada: ${safe}`);
    seen.add(key);
    if(flags&1)throw Error(`El archivo ${safe} está cifrado.`);
    if(method!==0&&method!==8)throw Error(`Compresión no compatible en ${safe}.`);
    totalUncompressed+=uncompressed;
    if(totalUncompressed>250*1024*1024)throw Error('El contenido descomprimido supera 250 MB.');
    if(localOffset+30>bytes.length||view.getUint32(localOffset,true)!==0x04034b50)throw Error(`Cabecera local inválida en ${safe}.`);
    const localNameLen=view.getUint16(localOffset+26,true),localExtraLen=view.getUint16(localOffset+28,true),start=localOffset+30+localNameLen+localExtraLen;
    if(start+compressed>bytes.length||start+compressed>cdOffset)throw Error(`El contenido de ${safe} está incompleto.`);
    files.push({name:safe,method,raw:bytes.slice(start,start+compressed),uncompressed,crc})
  }
  return files
}
async function inflateEntry(entry){
  let output;
  if(entry.method===0)output=entry.raw;
  else{
    if(typeof DecompressionStream!=='function')throw Error('Este navegador no puede descomprimir DEFLATE.');
    const ds=new DecompressionStream('deflate-raw'),reader=new Blob([entry.raw]).stream().pipeThrough(ds).getReader(),chunks=[];
    let total=0;
    try{
      while(true){
        const {done,value}=await reader.read();
        if(done)break;
        total+=value.length;
        if(total>250*1024*1024||total>entry.uncompressed)throw Error(`El archivo ${entry.name} supera el tamaño declarado.`);
        chunks.push(value)
      }
    }finally{reader.releaseLock()}
    output=concatBytes(chunks)
  }
  if(output.length!==entry.uncompressed)throw Error(`El tamaño descomprimido no coincide en ${entry.name}.`);
  if(crc32(output)!==(entry.crc>>>0))throw Error(`Verificación de integridad falló en ${entry.name}.`);
  return output
}
function iniToItem(text,path){
  const p=parseIni(text).sections,core=p.core||{};
  const id=slug(core.name||path.split('/').pop().replace(/\.ini$/i,''));
  const isBuilding=/^(true|1|yes)$/i.test(core.isbuilding||'');
  return{
    id,
    name:core.displaytext||id,
    faction:project.factions[0]?.id||'',
    category:'Importado',
    hp:num(core.maxhp,300),
    cost:num(String(core.price||'0').replace(/[^0-9.].*$/,''),0),
    mass:num(core.mass,3000),
    radius:num(core.radius,12),
    buildTime:core.buildspeed||'10s',
    description:core.displaydescription||'',
    damage:num(p.attack?.damage,0),
    reload:num(p.attack?.reload,1),
    range:num(p.attack?.range,0),
    speed:num(p.movement?.speed,1.2),
    isBuilding,
    config:text
  }
}
async function importRwmod(file){
  if(file.size>100*1024*1024)throw Error('El archivo supera 100 MB.');
  const bytes=new Uint8Array(await file.arrayBuffer());
  const files=parseZip(bytes);
  let modInfo='';
  const importedUnits=[],importedBuildings=[],importedAssets=[];
  for(const f of files){
    if(f.name.endsWith('/'))continue;
    const safe=safePath(f.name);
    const content=await inflateEntry(f);
    if(safe.toLowerCase()==='mod.info'||safe.toLowerCase()==='mod-info.txt'){
      modInfo=new TextDecoder().decode(content)
    }else if(/^units\/.+\.ini$/i.test(safe)){
      const item=iniToItem(new TextDecoder().decode(content),safe);
      if(item.isBuilding)importedBuildings.push(item);
      else importedUnits.push(item)
    }else{
      const mime=safe.endsWith('.png')?'image/png':safe.endsWith('.jpg')||safe.endsWith('.jpeg')?'image/jpeg':safe.endsWith('.webp')?'image/webp':safe.endsWith('.ogg')?'audio/ogg':'application/octet-stream';
      let binary='';
      for(let i=0;i<content.length;i+=0x8000)binary+=String.fromCharCode(...content.subarray(i,i+0x8000));
      importedAssets.push({path:safe,data:`data:${mime};base64,${btoa(binary)}`,type:mime,size:content.length})
    }
  }
  if(!importedUnits.length&&!importedBuildings.length)throw Error('No se encontraron INI dentro de units/.');
  const replace=confirm(
    `Encontrados: ${importedUnits.length} unidades, ${importedBuildings.length} edificios, ${importedAssets.length} recursos.\n\n`+
    `Aceptar: reemplazar todo.\nCancelar: fusionar (solo añade nuevos).\n\n`+
    `Las facciones, componentes y mejoras no se modifican.`
  );
  if(replace){
    project.units=importedUnits;
    project.buildings=importedBuildings;
    project.assets=importedAssets
  }else{
    const existingIds=new Set([...project.units,...project.buildings].map(x=>x.id.toLowerCase()));
    for(const u of importedUnits){if(!existingIds.has(u.id.toLowerCase())){project.units.push(u);existingIds.add(u.id.toLowerCase())}}
    for(const b of importedBuildings){if(!existingIds.has(b.id.toLowerCase())){project.buildings.push(b);existingIds.add(b.id.toLowerCase())}}
    const existingPaths=new Set(project.assets.map(a=>a.path.toLowerCase()));
    for(const a of importedAssets){if(!existingPaths.has(a.path.toLowerCase())){project.assets.push(a);existingPaths.add(a.path.toLowerCase())}}
  }
  if(modInfo){
    const find=k=>{const m=modInfo.match(new RegExp(`^\\s*${k}\\s*[:=]\\s*(.*)$`,'im'));return m?m[1].trim():''};
    const name=find('name')||find('title');
    const desc=find('description');
    const author=find('author');
    const version=find('version');
    if(name)project.meta.name=clampText(name,80);
    if(desc)project.meta.description=clampText(desc,600);
    if(author)project.meta.author=clampText(author,70);
    if(version)project.meta.version=clampText(version,24);
    project.meta.id=slug(project.meta.name)
  }
  scheduleSave();navigate('dashboard');
  notify(`Importación completada: ${importedUnits.length} unidades, ${importedBuildings.length} edificios y ${importedAssets.length} recursos.`)
}
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();saveNow().then(ok=>notify(ok?'Proyecto guardado.':'No se pudo guardar.','good'))}
  if(e.key==='Escape'){
    if(modal){modal=null;document.body.classList.remove('modalopen');render()}
    else{document.body.classList.remove('menuopen');const b=$('#menu-toggle');if(b){b.setAttribute('aria-expanded','false');b.setAttribute('aria-label','Abrir menú')}}
  }
});
document.addEventListener('click',e=>{
  if(!document.body.classList.contains('menuopen'))return;
  const target=e.target;
  if(target.closest?.('.sidebar')||target.closest?.('#menu-toggle'))return;
  document.body.classList.remove('menuopen');
  const button=$('#menu-toggle');
  if(button){button.setAttribute('aria-expanded','false');button.setAttribute('aria-label','Abrir menú')}
});
window.addEventListener('beforeunload',e=>{
  if(dirty){
    try{localStorage.setItem(APP_KEY,JSON.stringify(project))}catch{}
    e.preventDefault();e.returnValue=''
  }
});
window.addEventListener('pagehide',()=>{
  if(dirty&&db){try{idbSet(project).catch(()=>{})}catch{}}
});
window.addEventListener('dragover',e=>{if(e.dataTransfer?.types?.includes('Files'))e.preventDefault()});
boot();
})();
