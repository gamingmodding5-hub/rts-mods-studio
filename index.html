<script>
'use strict';
(() => {

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const humanBytes=n=>n<1024?`${n} B`:n<1048576?`${(n/1024).toFixed(1)} KB`:`${(n/1048576).toFixed(1)} MB`;
const clone=x=>JSON.parse(JSON.stringify(x));
const starter=()=>({schema:3,meta:{name:'Mi primer mod',id:'mi_primer_mod',version:'1.0',author:'Creador',description:'Proyecto creado con rts-mods-studio.'},factions:[{id:'industria',name:'Industria',color:'#4f9bff',description:'Producción y logística.',startingCredits:1200,income:8,buildSpeed:1,strengths:'Economía y desarrollo',weaknesses:'Costes de expansión elevados'},{id:'defensa',name:'Defensa',color:'#43c59e',description:'Resistencia y protección.',startingCredits:1000,income:7,buildSpeed:.9,strengths:'Protección y durabilidad',weaknesses:'Crecimiento más lento'},{id:'tecnologia',name:'Tecnología',color:'#b18cff',description:'Investigación y desarrollo.',startingCredits:900,income:6,buildSpeed:1.1,strengths:'Innovación y eficiencia',weaknesses:'Recursos iniciales limitados'}],units:[{id:'trabajador',name:'Trabajador',faction:'industria',category:'Constructor',hp:220,cost:150,mass:3000,radius:10,buildTime:'8s',description:'Unidad básica de construcción.',damage:0,reload:1,range:0,speed:1,armor:0,sight:120,config:''}],buildings:[{id:'centro_civico',name:'Centro cívico',faction:'industria',category:'Centro',hp:1800,cost:900,mass:10000,radius:20,buildTime:'35s',description:'Centro administrativo de la nación.',incomePerMinute:0,buildRadius:0,config:''}],assets:[],sprites:{},components:[],maps:[],technologies:[]});
let project=starter(), tab='dashboard', modal=null, storageMode='Iniciando…', saveTimer=0, dirty=false, filter='', componentEditingId=null, enteredWorkspace=false;
let db=null, mapEditingId='', mapDraft=null, mapTool='plain', technologyEditingId='';

function openDB(){return new Promise((resolve,reject)=>{if(!('indexedDB'in window)){reject(Error('IndexedDB no disponible'));return}const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains(DB_STORE))d.createObjectStore(DB_STORE)};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||Error('No se pudo abrir IndexedDB'))})}

function normalizeProject(raw){if(!raw||typeof raw!=='object')throw Error('El archivo no contiene un proyecto válido');const base=starter();const p={schema:3,meta:{...base.meta,...(raw.meta||{})},factions:Array.isArray(raw.factions)?raw.factions:base.factions,units:Array.isArray(raw.units)?raw.units:[],buildings:Array.isArray(raw.buildings)?raw.buildings:[],assets:Array.isArray(raw.assets)?raw.assets:[],sprites:raw.sprites&&typeof raw.sprites==='object'?raw.sprites:{},components:Array.isArray(raw.components)?raw.components:[],maps:Array.isArray(raw.maps)?raw.maps:[],technologies:Array.isArray(raw.technologies)?raw.technologies:[]};for(const k of ['factions','units','buildings'])p[k]=p[k].map(x=>({...x,id:slug(x.id||x.name),name:String(x.name||x.id||'Sin nombre')}));p.assets=p.assets.filter(a=>a&&typeof a.path==='string'&&typeof a.data==='string').map(a=>({path:safePath(a.path),data:a.data,type:a.type||'application/octet-stream',size:num(a.size,0)}));p.components=(Array.isArray(p.components)?p.components:[]).filter(x=>x&&typeof x==='object').map(x=>({...x,id:slug(x.id||x.name),name:String(x.name||x.id||'Componente'),kind:['weapon','ability','upgrade','snippet'].includes(x.kind)?x.kind:'snippet',target:String(x.target||''),description:String(x.description||''),config:String(x.config||'')}));p.maps=p.maps.filter(m=>m&&typeof m==='object').map(m=>({...m,id:slug(m.id||m.name),name:String(m.name||m.id||'Mapa'),width:Math.max(8,Math.min(64,num(m.width,32))),height:Math.max(8,Math.min(48,num(m.height,24))),tiles:Array.from({length:Math.max(8,Math.min(64,num(m.width,32)))*Math.max(8,Math.min(48,num(m.height,24)))},(_,i)=>['plain','water','forest','rock','road'].includes(m.tiles?.[i])?m.tiles[i]:'plain'),markers:Array.isArray(m.markers)?m.markers.filter(v=>v&&Number.isInteger(v.x)&&Number.isInteger(v.y)&&v.x>=0&&v.x<num(m.width,32)&&v.y>=0&&v.y<num(m.height,24)&&['base','spawn','resource','oil'].includes(v.type)):[]}));p.technologies=p.technologies.filter(t=>t&&typeof t==='ob nt" id="view">${body}</section></main></div>${modal?renderModal():''}`}

function dashboard(){const issues=validate();return `${pageHead('INICIO','Panel de tu mod','Crea las partes de tu mod paso a paso. Tu trabajo se guarda automáticamente en este navegador.','<button class="btn" data-tab="project">Configurar mi mod</button>')}<div class="hero"><div><div class="kicker">PROYECTO ACTUAL</div><h2>${esc(project.meta.name)}</h2><p>${esc(project.meta.description||'Añade una descripción en «Tu proyecto».')}</p><div class="hero-meta"><span>Versión ${esc(project.meta.version)}</span><span>Autor: ${esc(project.meta.author)}</span><span>${project.assets.length} archivos</span></div></div><div class="hero-mark" aria-hidden="true">R</div></div><div class="stats">${stat('Unidades',project.units.length,'◈','Personajes y vehículos')}${stat('Edificios',project.buildings.length,'▥','Bases y estructuras')}${stat('Facciones',project.factions.length,'⬡','Equipos o naciones')}${stat('Avisos',issues.length,'✓',issues.length?'Hay detalles para revisar':'Sin avisos básicos')}</div><div class="panel onboarding"><div class="panelhead"><div><h3>Empieza por aquí</h3><p>No necesitas completar todo de una vez. Puedes avanzar a tu ritmo.</p></div></div><div class="guide-steps"><button data-tab="project"><i>1</i><span><b>Identifica tu mod</b><small>Escribe su nombre, versión y descripción.</small></span></button><button data-tab="factions"><i>2</i><span><b>Crea tus facciones</b><small>Define sus colores, recursos y especialidades.</small></span></button><button data-tab="units"><i>3</i><span><b>Añade unidades y edificios</b><small>Personaliza salud, coste, construcción y configuración.</small></span></button><button data-tab="sprites"><i>4</i><span><b>Diseña imágenes</b><small>Crea sprites y asígnalos a tus elementos.</small></span></button><button data-tab="maps"><i>5</i><span><b>Planifica un mapa</b><small>Dibuja el terreno y coloca bases o recursos.</small></span></button><button data-tab="validator"><i>6</i><span><b>Revisa y prepara el mod</b><small>Busca problemas function projectPage(){return `${pageHead('CONFIGURACIÓN','Datos del mod','Ponle nombre a tu creación y completa sus datos básicos. Se guardan automáticamente en este dispositivo.','<button class="btn" id="save-meta">Guardar cambios</button>')}<div class="formgrid"><div class="panel formpanel"><h3>Información general</h3><p class="muted">Estos datos se utilizan al preparar el paquete del mod.</p><form id="meta-form"><label class="field">Nombre que verá la gente<input name="name" required maxlength="80" value="${esc(project.meta.name)}"><small>Es el nombre que reconocerás al instalarlo.</small></label><label class="field">Nombre técnico del proyecto<input name="id" required pattern="[a-zA-Z0-9_]+" maxlength="48" value="${esc(project.meta.id)}"><small>Se usa para nombrar el mod: escribe letras, números o guion bajo, sin espacios.</small></label><div class="twocol"><label class="field">Versión<input name="version" value="${esc(project.meta.version)}" maxlength="24" placeholder="1.0"></label><label class="field">Autor<input name="author" value="${esc(project.meta.author)}" maxlength="70" placeholder="Tu nombre o equipo"></label></div><label class="field">Descripción<textarea name="description" maxlength="600" placeholder="Explica de qué trata el mod.">${esc(project.meta.description)}</textarea><small>Una descripción breve ayuda a identificar el contenido del mod.</small></label><div class="divider"></div><button type="button" class="btn secondary" id="import-rwmod">Cargar contenido desde un mod (.rwmod)</button><input type="file" id="rwmod-file" accept=".rwmod,.zip,application/zip" hidden></form></div><div class="panel info-panel"><div class="info-icon">ⓘ</div><h3>Guardado automático</h3><p>Tu trabajo se guarda automáticamente en este dispositivo. No se envían tus archivos a un servidor.</p><p><strong>Consejo:</strong> usa «Crear paquete» para generar el archivo .rwmod que puedes probar en Rusted Warfare. Ese paquete sirve para instalar el mod; no contiene todas las herramientas de edición de esta plataforma.</p><p class="footnote">No borres los datos del navegador ni uses el modo privado para proyectos que quieras conservar.</p></div></div>`}
function itemRow(type,x){const f=project.factions.find(z=>z.id===x.faction);return `<tr data-row-search="${esc((x.name+' '+x.id).toLowerCase())}"><td><div class="namecell">${type==='factions'?`<span class="color-dot" style="background:${esc(x.color)}"></span>`:''}<b>${esc(x.name)}</b><small>${esc(x.id)}</small></div></td>${type==='factions'?`<td>${esc(x.strengths||'No definida')}</td><td>${fmt(x.startingCredits)} créditos</td>`:`<td>${esc(f?.name||'Sin asignar')}</td><td>${esc(x.category||'General')}</td><td>${fmt(x.hp)}</td><td>${fmt(x.cost)}</td>`}<td class="rowactions"><button data-edit="${esc(x.id)}" title="Editar ${esc(x.name)}" aria-label="Editar ${esc(x.name)}">✎</button><button class="del" data-delete="${esc(x.id)}" title="Eliminar ${esc(x.name)}" aria-label="Eliminar ${esc(x.name)}">×</button></td></tr>`}
function fmt(v){return num(v).toLocaleString('es-ES')}
function collectionPage(type){const titles={units:['UNIDADES','Unidades','Unidad'],buildings:['EDIFICIOS','Edificios','Edificio'],factions:['FACCIÓN','Facciones','Facción']};const [tag,title,singular]=titles[type],list=project[type];return `${pageHead(tag,title,`Administra y edita ${title.toLowerCase()} del proyecto.`,`<button class="btn" data-action="new-${type}">＋ Nueva ${singular.toLowerCase()}</button>`)}<div class="panel tablepanel"><div class="toolbar"><div><b>Catálogo de ${title.toLowerCase()}</b><small>${list.length} elemento(s)</small></div><input class="search" id="list-search" type="search" placeholder="Buscar por nombre o ID…" value="${esc(filter)}" aria-label="Buscar elementos"></div>${list.length?`<div class="tablewrap"><table><thead><tr><th>Nombre / ID</th>${type==='factions'?'<th>Especialidad</th><th>Créditos iniciales</th>':'<th>Facción</th><th>Categoría</th><th>Salud</th><th>Coste</th>'}<th></th></tr></thead><tbody>${list.map(x=>itemRow(type,x)).join('')}</tbody></table></div>`:`<div class="empty"><strong>No hay ${title.toLowerCase()} todavía</strong><p>Crea el primer elemento para comenzar.</p><button class="btn" data-action="new-${type}">Crear ${singular.toLowerCase()}</button></div>`}</div><p class="footnote">Los campos de este catálogo son datos de organización. La configuración INI nativa se conserva por separado para que puedas ajustarla a tu versión del juego.</p>`}
function economyPage(){return `${pageHead('BALANCE','Economía por facción','Ajusta los valores económicos iniciales y las diferencias entre facciones.','<button class="btn" id="save-economy">Guardar economía</button>')}<div class="econgrid">${project.factions.map(f=>`<div class="panel econcard"><div class="factitle"><i class="color-dot" style="background:${esc(f.color)}"></i><div><h3>${esc(f.name)}</h3><small>${esc(f.id)}</small></div></div><label class="field">Créditos iniciales<input type="number" min="0" step="1" data-econ="${esc(f.id)}" data-field="startingCredits" value="${num(f.startingCredits)}"></label><label class="field">Ingresos base<input type="number" min="0" step="0.1" data-econ="${esc(f.id)}" data-field="income" value="${num(f.income)}"></label><label class="field">Multiplicador de construcción<input type="number" min="0.1" max="5" step="0.1" data-econ="${esc(f.id)}" data-field="buildSpeed" value="${num(f.buildSpeed,1)}"></label><div class="divider"></div><label class="field">Ventaja<input data-econ="${esc(f.id)}" data-field="strengths" value="${esc(f.strengths||'')}"></label><label class="field">Desventaja<input data-econ="${esc(f.id)}" data-field="weaknesses" value="${esc(f.weaknesses||'')}"></label></div>`).join('')||'<div class="panel empty">Crea una facción para configurar su economía.</div>'}</div><div class="note"><strong>Balance:</strong> estos valores describen el diseño económico del proyecto; no simulan una partida ni garantizan equilibrio. El efecto en el juego depende de cómo se apliquen en las configuraciones INI.</div>`}
function assetKind(path){const ext=String(path).split('.').pop().toLowerCase();if(['png','jpg','jpeg','webp','gif','bmp'].includes(ext))return 'Imagen';if(['ogg','wav','mp3'].includes(ext))return 'Audio';if(['tmx','tsx','map'].includes(ext))return 'Mapa';if(['ttf','otf','woff','woff2'].includes(ext))return 'Fuente';if(['ini','txt','xml','tmj'].includes(ext))return 'Configuración';return 'Otro'}
function assetsPage(){const total=project.assets.reduce((n,a)=>n+num(a.size),0);return `${pageHead('ARCHIVOS','Recursos del mod','Aquí guardas imágenes, mapas y archivos que utilizan tus unidades, edificios y otros elementos.','<button class="btn" id="add-assets">＋ Añadir archivos</button>')}<div class="panel"><div class="panelhead"><div><h3>Biblioteca de archivos</h3><p>${project.assets.length} archivo(s) · puedes añadir archivos sueltos o una carpeta.</p></div><span class="navcount">${humanBytes(total)}</span></div><div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Seleccionar o arrastrar archivos"><strong>Suelta aquí tus archivos</strong><span>O pulsa «Elegir archivos» para buscarlos en el dispositivo.</span><div class="toolrow"><button class="btn secondary small" id="browse-assets" type="button">Elegir archivos</button><button class="btn secondary small" id="add-folder" type="button">Añadir carpeta completa</button></div></div><input type="file" id="asset-files" multiple hidden><input type="file" id="asset-folder-files" webkitdirectory directory multiple hidden><div class="toolbar asset-toolbar"><div><b>Archivos añadidos</b><small>Las rutas se mantienen al crear el .rwmod.</small></div><input class="search" id="asset-search" type="search" placeholder="Buscar archivo…" aria-label="Buscar archivo"></div><div class="assetlist">${project.assets.length?project.assets.map((a,i)=>{const kind=assetKind(a.path),preview=kind==='Imagen'?`<img class="asset-thumb" src="${esc(a.data)}" alt="Vista previa de ${esc(a.path)}">`:kind==='Audio'?`<span class="asset-thumb asset-symbol">♫</span>`:kind==='Mapa'?`<span class="asset-thumb asset-symbol">▦</span>`:`<span class="asset-thumb asset-symbol">▧</span>`;return `<div class="assetrow assetrow-rich" data-asset-search="${esc((a.path+' '+kind).toLowerCase())}">${preview}<div class="asset-name"><b>${esc(a.path)}</b><small>${kind} · ${humanBytes(num(a.size))}</small></div><div class="asset-actions"><button class="btn ghost small" data-rename-asset="${i}" title="Cambiar ruta o nombre">Renombrar</button><button class="btn danger small" data-remove-asset="${i}" aria-label="Eliminar ${esc(a.path)}">Eliminar</button></div></div>`}).join(''):'<div class="empty"><strong>Aún no has añadido archivos.</strong><p>Ejemplos: imágenes PNG, mapas TMX y archivos de configuración INI.</p></div>'}</div></div><div class="note"><strong>Consejo:</strong> si una unidad usa una imagen llamada <code>sprites/tanque.png</code>, la ruta del recurso y la ruta escrita en el INI deben coincidir. La plataforma conserva los archivos; no convierte automáticamente todos los formatos.</div>`}
function spritePage(){const targets=[...project.units.map(x=>({id:x.id,name:x.name,type:'Unidad'})),...project.buildings.map(x=>({id:x.id,name:x.name,type:'Edificio/base'})),...project.factions.map(x=>({id:x.id,name:x.name,type:'Facción'}))];const selected=targets[0]?.id||'custom_sprite';const saved=Object.entries(project.sprites||{});return `${pageHead('DISEÑO VISUAL','Editor de sprites','Dibuja sprites pixel-art para unidades, bases, edificios, facciones y elementos personalizados. Exporta cada diseño como PNG.','<button class="btn" id="sprite-save">Guardar sprite</button>')}<div class="sprite-workspace"><section class="panel"><div class="panelhead"><div><h3>Lienzo pixel-art</h3><p>Usa el puntero o el dedo para dibujar. El lienzo se exporta como PNG transparente.</p></div><span class="navcount">PNG · RGBA</span></div><div class="sprite-stage"><canvas id="sprite-canvas" class="sprite-canvas" width="64" height="64" aria-label="Lienzo de dibujo de sprites de 64 por 64 píxeles"></canvas></div><div class="toolrow"><button class="btn secondary small active" data-sprite-tool="pen">✎ Pincel</button><button class="btn secondary small" data-sprite-tool="eraser">⌫ Borrador</button><button class="btn secondary small" id="sprite-clear">Limpiar</button><button class="btn secondary small" id="sprite-fill">Rellenar todo</button><button class="btn secondary small" id="sprite-flip">Voltear ↔</button><button class="btn secondary small" id="sprite-grid">Cuadrícula: visible</button></div><div class="palette-tools" aria-label="Colores rápidos"><span>Colores rápidos:</span>${['#ffffff','#c8d5e4','#72baff','#347dca','#43c99d','#efb45e','#fa8585','#b394ff','#26384a','#101820'].map(c=>`<button type="button" data-sprite-color="${c}" style="--swatch:${c}" aria-label="Color ${c}" title="${c}"></button>`).join('')}</div><label class="mirror-toggle"><input type="checkbox" id="sprite-mirror"> Dibujar simétricamente</label><div class="sprite-tools"><label class="field">Color<input id="sprite-color" type="color" value="#72baff"></label><label class="field">Tamaño del pincel<select id="sprite-brush"><option value="1">1 px</option><option value="2">2 px</option><option value="3">3 px</option><option value="4">4 px</option><option value="6">6 px</option><option value="8">8 px</option></select></label><label class="field">Resolución<select id="sprite-size"><option value="32">32 × 32</option><option value="64" selected>64 × 64</option><option value="96">96 × 96</option><option value="128">128 × 128</option><option value="256">256 × 256</option></select></label><label class="field">Zoom<select id="sprite-zoom"><option value="256">1×</option><option value="384">1.5×</option><option value="512" selected>2×</option><option value="768">3×</option></select></label></div></section><aside class="panel"><div class="panelhead"><div><h3>Asignación y exportación</h3><p>Vincula el PNG a un elemento del proyecto.</p></div></div><label class="field">Elemento relacionado<select id="sprite-target"><option value="custom_sprite">Elemento personalizado</option>${targets.map(x=>`<option value="${esc(x.id)}">${esc(x.type)} · ${esc(x.name)}</option>`).join('')}</select></label><label class="field">Nombre del sprite<input id="sprite-name" maxlength="60" value="sprite_personalizado" placeholder="ej. tanque_ligero"></label><label class="field">Ruta dentro del mod<input id="sprite-path" value="sprites/sprite_personalizado.png" spellcheck="false"></label><div class="toolrow"><button class="btn full" id="sprite-save-as">Guardar y vincular PNG</button><button class="btn secondary full" id="sprite-download">Descargar PNG</button></div><div class="divider"></div><h3>Sprites guardados (${saved.length})</h3><div id="sprite-library">${saved.length?saved.map(([id,x])=>`<div class="sprite-card"><img src="${x.data}" alt="Vista previa de ${esc(x.name||id)}"><div style="min-width:0;flex:1"><b>${esc(x.name||id)}</b><small>${esc(x.path||`sprites/${id}.png`)}</small></div><button class="btn secondary small" data-load-sprite="${esc(id)}">Editar</button></div>`).join(''):'<p class="muted">Todavía no hay sprites guardados.</p>'}</div><p class="muted">Los sprites se almacenan dentro del proyecto y se agregan al paquete .rwmod en su ruta indicada. Para usarlos en el juego, referencia esa ruta en la configuración gráfica INI del elemento.</p></aside></div>`}
function attachSpriteToElement(target,path){const item=[...project.units,...project.buildings].find(x=>x.id===target);if(!item)return;let text=String(item.config||'').trim();if(!text)text=generatedIni(item,project.buildings.includes(item)?'buildings':'units').trim();const lines=text.split(/\r?\n/);let start=-1,end=lines.length;for(let i=0;i<lines.length;i++){if(/^\s*\[graphics\]\s*$/i.test(lines[i])){start=i;for(let j=i+1;j<lines.length;j++)if(/^\s*\[[^\]]+\]\s*$/.test(lines[j])){end=j;break}break}}if(start<0)lines.push('', '[graphics]', `image: ${path}`);else{let found=false;for(let i=start+1;i<end;i++)if(/^\s*image\s*[:=]/i.test(lines[i])){lines[i]=`image: ${path}`;found=true;break}if(!found)lines.splice(end,0,`image: ${path}`)}item.config=lines.join('\n')+'\n'}
function setupSpriteEditor(){const canvas=$('#sprite-canvas');if(!canvas)return;const ctx=canvas.getContext('2d',{willReadFrequently:true});let drawing=false,tool='pen',grid=true,mirror=false;ctx.clearRect(0,0,canvas.width,canvas.height);const px=e=>{const r=canvas.getBoundingClientRect();return {x:Math.max(0,Math.min(canvas.width-1,Math.floor((e.clientX-r.left)/r.width*canvas.width))),y:Math.max(0,Math.min(canvas.height-1,Math.floor((e.clientY-r.top)/r.height*canvas.height)))}};let lastPoint=null;const stamp=p=>{const b=num($('#sprite-brush')?.value,1),x=Math.max(0,p.x-Math.floor(b/2)),y=Math.max(0,p.y-Math.floor(b/2));if(tool==='eraser')ctx.clearRect(x,y,b,b);else ctx.fillRect(x,y,b,b);if(mirror){const mx=canvas.width-x-b;if(tool==='eraser')ctx.clearRect(mx,y,b,b);else ctx.fillRect(mx,y,b,b)}};const paint=e=>{const p=px(e);if(lastPoint){const dx=p.x-lastPoint.x,dy=p.y-lastPoint.y,steps=Math.max(Math.abs(dx),Math.abs(dy),1);for(let i=1;i<=steps;i++)stamp({x:Math.round(lastPoint.x+dx*i/steps),y:Math.round(lastPoint.y+dy*i/steps)})}else stamp(p);lastPoint=p};canvas.addEventListener('pointerdown',e=>{drawing=true;lastPoint=null;ctx.fillStyle=tool==='eraser'?'rgba(0,0,0,0)':$('#sprite-color')?.value||'#72baff';canvas.setPointerCapture(e.pointerId);paint(e)});canvas.addEventListener('pointermove',e=>{if(drawing)paint(e)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>canvas.addEventListener(ev,()=>{drawing=false;lastPoint=null}));$$('[data-sprite-tool]').forEach(b=>b.addEventListener('click',()=>{tool=b.dataset.spriteTool;$$('[data-sprite-tool]').forEach(x=>x.classList.toggle('active',x===b))}));$('#sprite-clear')?.addEventListener('click',()=>ctx.clearRect(0,0,canvas.width,canvas.height));$('#sprite-fill')?.addEventListener('click',()=>{ctx.fillStyle=$('#sprite-color')?.value||'#72baff';ctx.fillRect(0,0,canvas.width,canvas.height)});$('#sprite-flip')?.addEventListener('click',()=>{const temp=document.createElement('canvas');temp.width=canvas.width;temp.height=canvas.height;temp.getContext('2d').drawImage(canvas,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.save();ctx.scale(-1,1);ctx.drawImage(temp,-canvas.width,0);ctx.restore()});$('#sprite-mirror')?.addEventListener('change',e=>{mirror=e.target.checked});$$('[data-sprite-color]').forEach(b=>b.addEventListener('click',()=>{$('#sprite-color').value=b.dataset.spriteColor;tool='pen';$$('[data-sprite-tool]').forEach(x=>x.classList.toggle('active',x.dataset.spriteTool==='pen'))}));$('#sprite-grid')?.addEventListener('click',e=>{grid=!grid;canvas.style.backgroundImage=grid?'':'none';e.currentTarget.textContent=`Cuadrícula: ${grid?'visible':'oculta'}`});$('#sprite-size')?.addEventListener('change',e=>{const old=document.createElement('canvas');old.width=canvas.width;old.height=canvas.height;old.getContext('2d').drawImage(canvas,0,0);canvas.width=canvas.height=num(e.target.value,64);ctx.imageSmoothingEnabled=false;ctx.drawImage(old,0,0,canvas.width,canvas.height)});$('#sprite-zoom')?.addEventListener('change',e=>{canvas.style.width=`min(100%,${e.target.value}px)`});$('#sprite-name')?.addEventListener('input',e=>{const v=slug(e.target.value)||'sprite_personalizado';$('#sprite-path').value=`sprites/${v}.png`});const png=()=>new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(Error('No se pudo crear el PNG.')),'image/png'));const save=async()=>{try{const name=$('#sprite-name').value.trim()||'sprite_personalizado',id=slug($('#sprite-target').value==='custom_sprite'?name:$('#sprite-target').value),path=safePath($('#sprite-path').value||`sprites/${slug(name)}.png`),blob=await png(),data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(blob)});project.sprites??={};project.sprites[id]={id,name,target:$('#sprite-target').value,path,data,width:canvas.width,height:canvas.height,type:'image/png',size:blob.size};if($('#sprite-target').value!=='custom_sprite')attachSpriteToElement($('#sprite-target').value,path);scheduleSave();notify('Sprite guardado y vinculado al proyecto.');render()}catch(e){notify(`No se pudo guardar: ${e.message}`,'bad')}};$('#sprite-save')?.addEventListener('click',save);$('#sprite-save-as')?.addEventListener('click',save);$('#sprite-download')?.addEventListener('click',async()=>{try{download(await png(),`${slug($('#sprite-name').value)||'sprite'}.png`)}catch(e){notify(e.message,'bad')}});$$('[data-load-sprite]').forEach(b=>b.addEventListener('click',async()=>{const x=project.sprites[b.dataset.loadSprite];if(!x)return;const im=new Image();im.onload=()=>{canvas.width=canvas.height=x.width||64;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.imageSmoothingEnabled=false;ctx.drawImage(im,0,0,canvas.width,canvas.height)};im.src=x.data;$('#sprite-name').value=x.name||b.dataset.loadSprite;$('#sprite-target').value=x.target||'custom_sprite';$('#sprite-path').value=x.path||`sprites/${b.dataset.loadSprite}.png`;notify('Sprite cargado en el lienzo.')}))}
function parseIni(text){const sections={},dups=[],keys=[];let section='';for(const [idx,raw] of String(text||'').split(/\r?\n/).entries()){const line=raw.trim();if(!line||line.startsWith('#')||line.startsWith(';'))continue;const sm=line.match(/^\[([^\]]+)\]$/);if(sm){section=sm[1].trim().toLowerCase();if(sections[section])dups.push(`Sección duplicada [${section}] (línea ${idx+1}).`);sections[section]??={};continue}const m=line.match(/^([^:=]+)\s*[:=]\s*(.*)$/);if(m&&section){const key=m[1].trim().toLowerCase();if(Object.prototype.hasOwnProperty.call(sections[section],key))dups.push(`Clave duplicada ${key} en [${section}] (línea ${idx+1}).`);sections[section][key]=m[2].trim();keys.push(`${section}.${key}`)}}return{sections,dups,keys}}
function validate(){const issues=[],all=[...project.units.map(x=>({...x,_type:'unidad'})),...project.buildings.map(x=>({...x,_type:'edificio'})),...project.factions.map(x=>({...x,_type:'facción'}))],ids=new Map();for(const x of all){if(!x.id)issues.push(['error',x.name,'Falta el identificador interno.']);else if(ids.has(x.id.toLowerCase()))issues.push(['error',x.name,`ID duplicado; también aparece en ${ids.get(x.id.toLowerCase())}.`]);else ids.set(x.id.toLowerCase(),x._type);if(!String(x.name||'').trim())issues.push(['error',x.id,'Falta el nombre visible.'])}if(!project.meta.name.trim())issues.push(['error','Metadatos','El proyecto no tiene nombre.']);if(!/^[a-z0-9_]+$/i.test(project.meta.id))issues.push(['error','Metadatos','El ID del proyecto solo puede contener letras, números y guion bajo.']);for(const x of [...project.units,...project.buildings]){if(!project.factions.some(f=>f.id===x.faction))issues.push(['error',x.name,`La facción ${x.faction||'(vacía)'} no existe.`]);if(num(x.hp)<=0)issues.push(['error',x.name,'La salud debe ser mayor que cero.']);if(num(x.cost)<0)issues.push(['error',x.name,'El coste no puede ser negativo.']);if(!String(x.config||'').trim()){issues.push(['warning',x.name,'No hay configuración INI nativa; se generará una plantilla mínima.']);continue}const p=parseIni(x.config);if(!p.sections.core)issues.push(['error',x.name,'La configuración no contiene la sección [core].']);else{for(const k of ['name','maxhp','price','mass','radius'])if(!(k in p.sections.core))issues.push(['warning',x.name,`Falta la clave [core] ${k}.`]);if(p.sections.core.name&&p.sections.core.name!==x.id)issues.push(['warning',x.name,`El name del INI (${p.sections.core.name}) no coincide con el ID ${x.id}.`])}for(const d of p.dups)issues.push(['error',x.name,d]);if(!p.sections.graphics)issues.push(['warning',x.name,'No se detecta [graphics]; revisa la imagen y su ruta.']);if(!p.sections.movement)issues.push(['warning',x.name,'No se detecta [movement]; revisa el tipo y velocidad de movimiento.']);const image=p.sections.graphics?.image;if(image&&!/^\s*(SHARED:|ROOT:)/i.test(image)){const safe=safePath(image.replace(/^[./]+/,''));if(!project.assets.some(a=>a.path.toLowerCase()===safe.toLowerCase())&&!Object.values(project.sprites||{}).some(sp=>String(sp.path).toLowerCase()===safe.toLowerCase()))issues.push(['warning',x.name,`No se adjuntó el recurso de imagen: ${image}.`])}}if(!project.factions.length)issues.push(['warning','Facciones','El proyecto no tiene facciones.']);if(!project.units.length)issues.push(['warning','Unidades','El proyecto no tiene unidades.']);if(!project.buildings.length)issues.push(['info','Edificios','Todavía no has creado edificios.']);for(const t of project.technologies){if(t.prerequisite&&!project.technologies.some(x=>x.id===t.prerequisite))issues.push(['error',t.name,'La mejora previa seleccionada ya no existe.']);let prereq=t.prerequisite,seen=new Set([t.id]);while(prereq){if(seen.has(prereq)){issues.push(['error',t.name,'Hay un ciclo de requisitos en el árbol de mejoras.']);break}seen.add(prereq);prereq=project.technologies.find(x=>x.id===prereq)?.prerequisite||''}if(t.target&&!([...project.units,...project.buildings].some(x=>x.id===t.target)))issues.push(['warning',t.name,'El elemento relacionado ya no existe.'])}for(const m of project.maps){if(m.tiles.length!==m.width*m.height)issues.push(['warning',m.name,'El plano tiene una cantidad de casillas incompleta.'])}for(const a of project.assets){if(!safePath(a.path))issues.push(['error',a.path,'Ruta de recurso no válida.'])}return issues}
function validatorPage(){const issues=validate(),counts={error:issues.filter(x=>x[0]==='error').length,warning:issues.filter(x=>x[0]==='warning').length,info:issues.filter(x=>x[0]==='info').length};return `${pageHead('CONTROL DE CALIDAD','Revisión del mod','Busca datos incompletos, referencias rotas y errores comunes antes de crear el paquete.','<button class="btn secondary" id="refresh-validation">↻ Analizar de nuevo</button>')}<div class="summary3"><div><strong>${counts.error}</strong><span>Errores</span></div><div><strong>${counts.warning}</strong><span>Advertencias</span></div><div><strong>${counts.info}</strong><span>Notas</span></div></div><div class="panel"><div class="panelhead"><div><h3>Resultados de la revisión</h3><p>${issues.length?`${issues.length} observación(es) para revisar.`:'No se detectaron incidencias en las comprobaciones disponibles.'}</p></div><span class="navcount">${issues.length?'REVISAR':'BÁSICO OK'}</span></div>${issues.length?issues.map(i=>`<div class="issue"><span class="badge ${i[0]}">${i[0]==='error'?'ERROR':i[0]==='warning'?'AVISO':'INFO'}</span><div><b>${esc(i[1])}</b><p>${esc(i[2])}</p></div></div>`).join(''):'<div class="success"><strong>✓ Validación básica superada</strong><p>La verificación no sustituye la prueba real dentro de Rusted Warfare.</p></div>'}</div><div class="note"><strong>Límite del análisis:</strong> este validador comprueba estructura básica, campos, duplicados, secciones INI comunes y rutas de imagen. No interpreta todas las opciones del motor ni ejecuta el juego. Valida los archivos en el juego antes de distribuir el mod.</div>`}
function exportPage(){const total=project.assets.reduce((n,a)=>n+num(a.size),0);return `${pageHead('PREPARAR EL MOD','Preparar el mod','Crea un paquete .rwmod con los archivos de tu proyecto para probarlo en Rusted Warfare.')}<div class="exportgrid single-export"><div class="panel exportcard"><div class="glyph">▣</div><div class="eyebrow">ARCHIVO PARA EL JUEGO</div><h2>Paquete .rwmod</h2><p>Reúne la información del mod, las configuraciones de unidades y edificios, las imágenes, los mapas y los demás recursos que has añadido.</p><div class="detailrow"><span>Elementos incluidos</span><b>${project.units.length+project.buildings.length} configuraciones</b></div><div class="detailrow"><span>Archivos añadidos</span><b>${project.assets.length} · ${humanBytes(total)}</b></div><div class="detailrow"><span>Formato de salida</span><b>ZIP / .rwmod</b></div><button class="btn full" id="export-rwmod">Crear archivo .rwmod ↓</button></div></div><div class="note"><strong>Antes de instalarlo:</strong> ejecuta «Comprobar mod» para revisar nombres, facciones, secciones INI y rutas de imágenes. Las configuraciones avanzadas y las claves específicas deben coincidir con la versión de Rusted Warfare que utilices.</div><p class="footnote">Los fragmentos de armas, habilidades y mejoras que guardes en la biblioteca se añaden al mod cuando los insertas en la configuración INI de una unidad o edificio. Un paquete generado no garantiza por sí solo que todas las mecánicas estén completas.</p>`}

function balancePage(){const units=project.units;const buildings=project.buildings;return `${pageHead('AJUSTE DEL JUEGO','Laboratorio de balance','Compara las estadísticas que has diseñado. Cambia los valores y observa el daño por segundo estimado.','<button class="btn secondary" id="balance-reset">Restablecer valores sugeridos</button>')}<div class="note"><strong>¿Para qué sirve?</strong> Es una hoja de diseño para comparar tus unidades y encontrar diferencias exageradas. Los datos de esta tabla no cambian por sí solos el comportamiento del juego: para aplicarlos tendrás que ajustar la configuración INI del elemento.</div><section class="panel tablepanel"><div class="toolbar"><div><b>Unidades</b><small>Modifica los números en la tabla. El daño por segundo se calcula automáticamente.</small></div><span class="navcount">${units.length} unidad(es)</span></div>${units.length?`<div class="tablewrap"><table class="balance-table"><thead><tr><th>Unidad</th><th>Salud</th><th>Coste</th><th>Daño</th><th>Recarga (s)</th><th>Alcance</th><th>Velocidad</th><th>Daño/s</th></tr></thead><tbody>${units.map(u=>`<tr><td><b>${esc(u.name)}</b><small>${esc(u.category||'')}</small></td>${[['hp',u.hp],['cost',u.cost],['damage',u.damage??60],['reload',u.reload??1],['range',u.range??130],['speed',u.speed??1.2]].map(([k,v])=>`<td><input type="number" min="0" step="0.1" data-balance="${esc(u.id)}" data-field="${k}" value="${num(v)}" aria-label="${esc(u.name)} ${k}"></td>`).join('')}<td><strong data-dps="${esc(u.id)}">${(num(u.damage,60)/Math.max(.1,num(u.reload,1))).toFixed(1)}</strong></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><strong>Aún no hay unidades.</strong><p>Crea unidades para poder comparar sus estadísticas.</p><button class="btn" data-tab="units">Crear una unidad</button></div>'}</section><section class="panel tablepanel" style="margin-top:14px"><div class="toolbar"><div><b>Edificios y bases</b><small>Revisa su resistencia, precio y aporte económico planificado.</small></div><span class="navcount">${buildings.length} edificio(s)</span></div>${buildings.length?`<div class="tablewrap"><table class="balance-table"><thead><tr><th>Edificio</th><th>Salud</th><th>Coste</th><th>Ingresos por minuto</th><th>Radio de construcción</th></tr></thead><tbody>${buildings.map(b=>`<tr><td><b>${esc(b.name)}</b><small>${esc(b.category||'')}</small></td>${[['hp',b.hp],['cost',b.cost],['incomePerMinute',b.incomePerMinute??0],['buildRadius',b.buildRadius??0]].map(([k,v])=>`<td><input type="number" min="0" step="1" data-balance="${esc(b.id)}" data-field="${k}" value="${num(v)}" aria-label="${esc(b.name)} ${k}"></td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'<div class="empty"><strong>Aún no hay edificios.</strong><p>Crea edificios o bases para configurar sus valores.</p><button class="btn" data-tab="buildings">Crear un edificio</button></div>'}</section><div class="note"><strong>Consejo de equilibrio:</strong> compara unidades del mismo rol. Una unidad rápida y barata puede tener menos salud o daño; una unidad pesada puede costar más y tardar más en construirse.</div>`}
function blankMap(id='boceto_mapa'){return{id,name:'Nuevo mapa',width:32,height:24,tiles:Array(32*24).fill('plain'),markers:[]}}
function mapPage(){let current=project.maps.find(m=>m.id===mapEditingId)||mapDraft||project.maps[0]||blankMap();mapDraft=current;if(!mapEditingId&&project.maps.includes(current))mapEditingId=current.id;const maps=project.maps||[];return `${pageHead('DISEÑO DE ESCENARIOS','Diseñador de mapas','Dibuja un boceto de terreno y coloca puntos de aparición, bases y recursos.','<button class="btn" id="map-new">＋ Nuevo mapa</button>')}<div class="note"><strong>Importante:</strong> este editor crea un plano visual para organizar tu mapa. Puedes guardarlo en el proyecto o como PNG. La imagen no es un mapa TMX listo para jugar; el mapa final debe crearse o completarse con una herramienta compatible con Rusted Warfare.</div><div class="map-layout"><section class="panel"><div class="panelhead"><div><h3>Plano del mapa</h3><p>Pulsa o arrastra sobre las casillas para dibujar el terreno.</p></div><span class="navcount">${current.width} × ${current.height}</span></div><div class="twocol"><label class="field">Nombre del mapa<input id="map-name" value="${esc(current.name)}" maxlength="60" placeholder="Ejemplo: Valle central"></label><label class="field">Tamaño del plano<select id="map-size"><option value="24x18" ${current.width===24&&current.height===18?'selected':''}>Pequeño · 24 × 18</option><option value="32x24" ${current.width===32&&current.height===24?'selected':''}>Mediano · 32 × 24</option><option value="40x30" ${current.width===40&&current.height===30?'selected':''}>Grande · 40 × 30</option></select></label></div><div class="map-tools"><span>Tipo de casilla:</span>${[['plain','Pradera'],['water','Agua'],['forest','Bosque'],['rock','Roca'],['road','Camino'],['base','Base'],['spawn','Inicio'],['resource','Recurso'],['oil','Petróleo'],['erase','Borrar']].map(([v,n])=>`<button class="btn ghost small ${mapTool===v?'active':''}" data-map-tool="${v}">${n}</button>`).join('')}</div><div class="map-stage"><canvas id="map-canvas" width="640" height="480" aria-label="Plano de mapa editable"></canvas></div><div class="toolrow"><button class="btn secondary small" id="map-clear">Limpiar el plano</button><button class="btn secondary small" id="map-save-png">Guardar PNG en recursos</button><button class="btn secondary small" id="map-download-png">Descargar PNG</button></div></section><aside class="panel"><div class="panelhead"><div><h3>Tus mapas</h3><p>${maps.length} plano(s) guardado(s).</p></div></div>${maps.length?`<div class="map-list">${maps.map(m=>`<button class="map-list-item ${m.id===current.id?'active':''}" data-map-open="${esc(m.id)}"><b>${esc(m.name)}</b><small>${m.width} × ${m.height} casillas</small></button>`).join('')}</div>`:'<p class="muted">Todavía no has guardado un plano. Pulsa «Guardar plano» cuando quieras conservar este diseño.</p>'}<div class="divider"></div><button class="btn full" id="map-save">Guardar plano</button><button class="btn danger full" style="margin-top:8px" id="map-delete" ${!maps.some(m=>m.id===current.id)?'disabled':''}>Eliminar plano guardado</button><div class="divider"></div><h3>Cómo dibujar</h3><p class="muted">1. Elige un tipo de casilla.<br>2. Dibuja en el plano.<br>3. Coloca bases, puntos de inicio y recursos.<br>4. Guarda el plano o conviértelo en una imagen de referencia.</p></aside></div>`}
function technologyPage(){const current=project.technologies.find(t=>t.id===technologyEditingId)||{id:'',name:'',target:'',prerequisite:'',cost:500,researchTime:30,effect:'',config:''};const targets=[...project.units.map(x=>({id:x.id,name:x.name,type:'Unidad'})),...project.buildings.map(x=>({id:x.id,name:x.name,type:'Edificio'}))];return `${pageHead('PROGRESIÓN DEL MOD','Árbol de mejoras','Planifica investigaciones, requisitos y mejoras para tus facciones.','<button class="btn" id="tech-new">＋ Nueva mejora</button>')}<div class="note"><strong>Cómo funciona:</strong> aquí diseñas la progresión de tu mod. Puedes enlazar una mejora con un elemento y guardar un fragmento INI opcional. La ficha no activa la investigación automáticamente: revisa y aplica su configuración al elemento del juego.</div><div class="tech-layout"><section class="panel"><div class="panelhead"><div><h3>Árbol de mejoras</h3><p>${project.technologies.length} mejora(s) diseñadas.</p></div></div>${project.technologies.length?`<div class="tech-list">${project.technologies.map(t=>{const pre=project.technologies.find(x=>x.id===t.prerequisite);const target=targets.find(x=>x.id===t.target);return `<article class="tech-card"><div class="tech-node">✦</div><div class="tech-content"><b>${esc(t.name)}</b><small>${pre?'Requiere: '+esc(pre.name):'Disponible desde el inicio'} · ${fmt(t.cost)} créditos · ${fmt(t.researchTime)} s</small><p>${esc(t.effect||'Sin descripción del efecto.')}</p><small>${target?'Aplicada a nivel de diseño: '+target.type+' · '+esc(target.name):'Sin elemento relacionado'}</small></div><div class="component-actions"><button class="btn ghost small" data-tech-edit="${esc(t.id)}">Editar</button><button class="btn danger small" data-tech-delete="${esc(t.id)}">Eliminar</button>${t.config&&t.target?`<button class="btn secondary small" data-tech-apply="${esc(t.id)}">Insertar INI</button>`:''}</div></article>`}).join('')}</div>`:'<div class="empty"><strong>Aún no hay mejoras.</strong><p>Crea la primera investigación para comenzar a construir el árbol tecnológico.</p><button class="btn" id="tech-new-empty">Crear primera mejora</button></div>'}</section><section class="panel"><div class="panelhead"><div><h3>${technologyEditingId?'Editar mejora':'Nueva mejora'}</h3><p>Describe sus requisitos y el efecto que tendrá en el diseño.</p></div></div><form id="tech-form"><label class="field">Nombre de la mejora<input name="name" required maxlength="70" value="${esc(current.name)}" placeholder="Ejemplo: Blindaje compuesto"></label><label class="field">Identificador técnico<input name="id" required pattern="[A-Za-z0-9_]+" maxlength="48" value="${esc(current.id)}" placeholder="blindaje_compuesto"></label><label class="field">Elemento relacionado<select name="target"><option value="">Sin asignar todavía</option>${targets.map(t=>`<option value="${esc(t.id)}" ${current.target===t.id?'selected':''}>${t.type}: ${esc(t.name)}</option>`).join('')}</select></label><label class="field">Mejora que debe investigarse antes<select name="prerequisite"><option value="">Ninguna · disponible desde el inicio</option>${project.technologies.filter(t=>t.id!==technologyEditingId).map(t=>`<option value="${esc(t.id)}" ${current.prerequisite===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></label><div class="twocol"><label class="field">Coste en créditos<input name="cost" type="number" min="0" step="1" value="${num(current.cost)}"></label><label class="field">Tiempo de investigación (segundos)<input name="researchTime" type="number" min="0" step="1" value="${num(current.researchTime)}"></label></div><label class="field">¿Qué cambia esta mejora?<textarea name="effect" maxlength="500" placeholder="Ejemplo: mejora la resistencia de los vehículos un 15 %. ">${esc(current.effect)}</textarea></label><label class="field">Configuración INI opcional<textarea name="config" spellcheck="false" style="min-height:115px;font:11px/1.5 ui-monospace,monospace" placeholder="# Añade aquí el fragmento que aplicarás al elemento.">${esc(current.config)}</textarea></label><div class="toolrow"><button class="btn" type="submit">Guardar mejora</button><button class="btn secondary" type="button" id="tech-cancel">Limpiar formulario</button></div></form></section></div>`}
function drawMapCanvas(){const canvas=$('#map-canvas');if(!canvas||!mapDraft)return;const ctx=canvas.getContext('2d');const w=mapDraft.width,h=mapDraft.height,cell=canvas.width/w;const colors={plain:'#789b57',water:'#397da8',forest:'#315f42',rock:'#777f86',road:'#b7a17b'};ctx.clearRect(0,0,canvas.width,canvas.height);for(let y=0;y<h;y++)for(let x=0;x<w;x++){const type=mapDraft.tiles[y*w+x]||'plain';ctx.fillStyle=colors[type]||colors.plain;ctx.fillRect(x*cell,y*cell,cell,cell)}ctx.strokeStyle='#14233399';ctx.lineWidth=1;for(let x=0;x<=w;x++){ctx.beginPath();ctx.moveTo(x*cell,0);ctx.lineTo(x*cell,canvas.height);ctx.stroke()}for(let y=0;y<=h;y++){ctx.beginPath();ctx.moveTo(0,y*cell);ctx.lineTo(canvas.width,y*cell);ctx.stroke()}const glyph={base:'B',spawn:'I',resource:'$',oil:'O'};for(const m of mapDraft.markers||[]){ctx.fillStyle=m.type==='oil'?'#242424':m.type==='resource'?'#ffd36a':m.type==='base'?'#d9e9ff':'#f4f4f4';ctx.beginPath();ctx.arc((m.x+.5)*cell,(m.y+.5)*cell,cell*.36,0,Math.PI*2);ctx.fill();ctx.fillStyle='#17202a';ctx.font=`bold ${Math.floor(cell*.55)}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(glyph[m.type]||'?',(m.x+.5)*cell,(m.y+.5)*cell)}}
function paintMapAt(e){const canvas=$('#map-canvas');if(!canvas||!mapDraft)return;const r=canvas.getBoundingClientRect(),x=Math.max(0,Math.min(mapDraft.width-1,Math.floor((e.clientX-r.left)/r.width*mapDraft.width))),y=Math.max(0,Math.min(mapDraft.height-1,Math.floor((e.clientY-r.top)/r.height*mapDraft.height))),idx=y*mapDraft.width+x;if(['base','spawn','resource','oil'].includes(mapTool)){mapDraft.markers=mapDraft.markers.filter(m=>!(m.x===x&&m.y===y));mapDraft.markers.push({x,y,type:mapTool})}else if(mapTool==='erase'){mapDraft.tiles[idx]='plain';mapDraft.markers=mapDraft.markers.filter(m=>m.x!==x||m.y!==y)}else mapDraft.tiles[idx]=mapTool;drawMapCanvas();if(project.maps.includes(mapDraft))scheduleSave()}
function saveTechnology(){const form=$('#tech-form');if(!form||!form.reportValidity())return;const d=Object.fromEntries(new FormData(form));d.id=slug(d.id);d.cost=num(d.cost);d.researchTime=num(d.researchTime);if(d.id===d.prerequisite){notify('Una mejora no puede depender de sí misma.','bad');return}if(project.technologies.some(t=>t.id===d.id&&t.id!==technologyEditingId)){notify('Ya existe una mejora con ese identificador.','bad');return}const old=project.technologies.findIndex(t=>t.id===technologyEditingId);if(old>=0){const oldId=project.technologies[old].id;project.technologies[old]=d;if(oldId!==d.id)project.technologies.forEach(t=>{if(t.prerequisite===oldId)t.prerequisite=d.id})}else project.technologies.push(d);technologyEditingId=d.id;scheduleSave();render();notify('Mejora guardada.')}
function applyTechnology(id){const t=project.technologies.find(x=>x.id===id);if(!t||!t.config||!t.target){notify('Completa el fragmento INI y selecciona un elemento relacionado.','bad');return}const target=[...project.units,...project.buildings].find(x=>x.id===t.target);if(!target){notify('El elemento relacionado ya no existe.','bad');return}if(String(target.config||'').includes(t.config)){notify('Este fragmento ya está incluido.','bad');return}target.config=(String(target.config||'').trim()+'\n\n# Mejora planificada: '+t.name+'\n'+t.config.trim()+'\n').trim()+'\n';scheduleSave();notify('Fragmento insertado. Revisa la configuración antes de probar el mod.')}

function helpPage(){return `${pageHead('CENTRO DE AYUDA','Guía para crear tu primer mod','Explicaciones sencillas de cada herramienta y de los archivos que utiliza Rusted Warfare.')}<div class="guide-steps"><button data-tab="project"><i>1</i><span><b>Prepara el proyecto</b><small>Escribe un nombre, autor y descripción.</small></span></button><button data-tab="factions"><i>2</i><span><b>Define las facciones</b><small>Crea los equipos y sus características.</small></span></button><button data-tab="units"><i>3</i><span><b>Crea unidades y edificios</b><small>Configura su salud, coste y especialidad.</small></span></button><button data-tab="sprites"><i>4</i><span><b>Diseña las imágenes</b><small>Dibuja los gráficos y asígnalos a los elementos.</small></span></button><button data-tab="maps"><i>5</i><span><b>Planifica escenarios</b><small>Haz un plano de terrenos, bases y recursos.</small></span></button><button data-tab="validator"><i>6</i><span><b>Revisa y crea el archivo</b><small>Corrige avisos y prepara el paquete .rwmod.</small></span></button></div><div class="grid2" style="margin-top:14px"><section class="panel"><div class="panelhead"><div><h3>Palabras que verás en la plataforma</h3><p>Una explicación rápida de los términos técnicos.</p></div></div>${[['ID o identificador técnico','Un nombre corto y único que usa el programa para reconocer cada elemento. No es necesariamente el nombre que verá el jugador.'],['Facción','Un equipo, nación o grupo que participa en la partida.'],['Unidad','Un personaje, vehículo o máquina que puede actuar en el juego.'],['Edificio o base','Una estructura que produce recursos, unidades o defensa.'],['Sprite','Una imagen 2D que representa una unidad, edificio u objeto.'],['Recurso','Un archivo que utiliza el mod: imagen, mapa, sonido o configuración.'],['INI','Un archivo de texto con instrucciones para el juego. Es la configuración técnica del elemento.'],['Paquete .rwmod','El archivo que reúne los recursos y configuraciones del mod para instalarlo o probarlo.'],['Balance','La comparación de costes, resistencia, velocidad y daño para evitar elementos demasiado fuertes o débiles.'],['Árbol de mejoras','Un plan de investigaciones que indica qué mejora se puede desbloquear y qué requisito necesita.']].map(([k,v])=>`<div class="issue"><div><b>${k}</b><p>${v}</p></div></div>`).join('')}</section><section class="panel"><div class="panelhead"><div><h3>Preguntas frecuentes</h3><p>Lo que conviene saber antes de empezar.</p></div></div><div class="faq-item"><b>¿Se guarda mi trabajo?</b><p>Sí. La plataforma guarda los cambios automáticamente en el almacenamiento de este navegador y dispositivo. No borres los datos del sitio si quieres conservar el proyecto.</p></div><div class="faq-item"><b>¿Todo lo que edito funciona automáticamente en el juego?</b><p>No. Los datos de balance, las fichas de tecnología y los planos de mapas ayudan a diseñar. Para que una mecánica funcione en Rusted Warfare debe estar expresada en una configuración compatible con el juego.</p></div><div class="faq-item"><b>¿El plano de mapa se puede jugar?</b><p>No directamente. El editor de mapas crea una imagen de referencia PNG, no un mapa TMX terminado. Puedes usarlo como guía al construir el escenario en una herramienta de mapas compatible.</p></div><div class="faq-item"><b>¿Para qué sirve «Revisar el mod»?</b><p>Busca problemas comunes como identificadores repetidos, facciones que faltan, secciones INI incompletas y rutas de imágenes que no existen.</p></div><div class="faq-item"><b>¿Qué archivo debo crear al final?</b><p>Usa «Preparar archivo» para reunir el contenido en un paquete .rwmod. Después prueba el paquete dentro de Rusted Warfare: una validación básica no sustituye una prueba en el juego.</p></div><button class="btn full" data-tab="project">Comenzar con los datos del mod</button></section></div>`}

Draft)return;const [w,h]=e.target.value.split('x').map(Number),oldW=mapDraft.width,oldH=mapDraft.height,old=mapDraft.tiles;const next=Array(w*h).fill('plain');for(let y=0;y<Math.min(h,oldH);y++)for(let x=0;x<Math.min(w,oldW);x++)next[y*w+x]=old[y*oldW+x]||'plain';mapDraft.width=w;mapDraft.height=h;mapDraft.tiles=next;mapDraft.markers=(mapDraft.markers||[]).filter(m=>m.x<w&&m.y<h);drawMapCanvas();if(project.maps.includes(mapDraft))scheduleSave()});$('#map-save')?.addEventListener('click',()=>{if(!mapDraft)return;const name=$('#map-name')?.value.trim()||'Nuevo mapa';mapDraft.name=name;let id=slug(mapDraft.id||name);mapDraft.id=id;if(project.maps.some(m=>m.id===id&&m!==mapDraft)){id=slug(name+'_'+Date.now().toString().slice(-4));mapDraft.id=id}const idx=project.maps.findIndex(m=>m.id===id);if(idx>=0)project.maps[idx]=mapDraft;else project.maps.push(mapDraft);mapEditingId=id;scheduleSave();render();notify('Plano guardado en este proyecto.')});$('#map-delete')?.addEventListener('click',()=>{if(!mapDraft||!project.maps.some(m=>m.id===mapDraft.id))return;if(!confirm('¿Eliminar este plano guardado?'))return;project.maps=project.maps.filter(m=>m.id!==mapDraft.id);mapEditingId='';mapDraft=blankMap();scheduleSave();render();notify('Plano eliminado.')});const saveMapPng=async(addToAssets)=>{const c=$('#map-canvas');if(!c)return;const name=slug($('#map-name')?.value||'mapa')||'mapa';const blob=await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(Error('No se pudo crear la imagen.')),'image/png'));if(addToAssets){const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(blob)});const path=`maps/${name}.png`,existing=project.assets.find(a=>a.path===path);if(existing)Object.assign(existing,{data,size:blob.size,type:'image/png'});else project.assets.push({path,data,size:blob.size,type:'image/png'});scheduleSave();notify('Imagen de referencia añadida a Recursos.')}else download(blob,`${name}.png`)};$('#map function openEditor(type,id){if(!['units','buildings','factions'].includes(type))return;const list=project[type],old=id?list.find(x=>x.id===id):null;modal={type,id,old:old?clone(old):null};render()}
function defaults(type){if(type==='factions')return{id:'',name:'',color:'#5da8ff',description:'',startingCredits:1000,income:5,buildSpeed:1,strengths:'',weaknesses:''};return{id:'',name:'',faction:project.factions[0]?.id||'',category:type==='units'?'Apoyo':'Servicio',hp:300,cost:200,mass:3000,radius:12,buildTime:'10s',description:'',config:''}}
function generatedIni(x,type){const category=type==='buildings'?'building':'unit';return `# Plantilla de ${category} creada con rts-mods-studio.\n# Revisa y completa las secciones segun la documentacion de tu version del juego.\n[core]\nname: ${x.id||'new_unit'}\ndisplayText: ${x.name||'New unit'}\ndisplayDescription: ${String(x.description||'').replace(/\r?\n/g,' ')}\nprice: ${num(x.cost,100)}\nmaxHp: ${num(x.hp,300)}\nmass: ${num(x.mass,3000)}\nradius: ${num(x.radius,12)}\nbuildSpeed: ${x.buildTime||'10s'}\n\n# Añade las opciones necesarias de [graphics], [attack] y [movement].\n# Si es un edificio, configura su comportamiento con claves compatibles con el juego.\n`}
function componentKindName(kind){return({weapon:'Arma',ability:'Habilidad',upgrade:'Mejora',snippet:'Fragmento personalizado'})[kind]||'Componente'}
function componentTemplate(kind,id){const label=componentKindName(kind).toLowerCase();return `# ${label}: ${id||'nuevo_componente'}\n# Fragmento de trabajo reutilizable. Completa las claves con la documentación de Rusted Warfare.\n# Este texto no se convierte en una mecánica hasta insertarlo y configurar el INI de destino.\n`}
function componentsPage(){const current=project.components.find(x=>x.id===componentEditingId),x=current||{id:'',name:'',kind:'weapon',target:project.units[0]?.id||project.buildings[0]?.id||'',description:'',config:''};const targets=[...project.units.map(v=>({...v,_type:'Unidad'})),...project.buildings.map(v=>({...v,_type:'Edificio'}))];return `${pageHead('PERSONALIZACIÓN AVANZADA','Armas, habilidades y mejoras','Crea fragmentos reutilizables y añádelos a la configuración de tus unidades o edificios.','<button class="btn" id="component-new">＋ Nuevo componente</button>')}<div class="note"><strong>Cómo funciona:</strong> aquí puedes guardar bloques de configuración para reutilizarlos. Para que tengan efecto en el juego, selecciona una unidad o edificio y pulsa «Insertar en INI». Completa las claves según la documentación del juego; la biblioteca no inventa efectos automáticamente.</div><div class="component-layout"><section class="panel"><div class="panelhead"><div><h3>Mi biblioteca</h3><p>${project.components.length} componente(s) guardado(s).</p></div></div>${project.components.length?`<div class="component-list">${project.components.map(c=>`<article class="component-card"><div class="component-badge">${c.kind==='weapon'?'⚔':c.kind==='ability'?'✦':c.kind==='upgrade'?'⇧':'⌘'}</div><div class="component-main"><b>${esc(c.name)}</b><small>${componentKindName(c.kind)} · ${esc(c.target?targets.find(t=>t.id===c.target)?.name||'Destino no disponible':'Sin destino')}</small><p>${esc(c.description||'Sin descripción.')}</p></div><div class="component-actions"><button class="btn ghost small" data-comp-edit="${esc(c.id)}">Editar</button><button class="btn secondary small" data-comp-apply="${esc(c.id)}" ${!c.target?'disabled':''}>Insertar en INI</button><button class="btn danger small" data-comp-delete="${esc(c.id)}">Eliminar</button></div></article>`).join('')}</div>`:'<div class="empty"><strong>Tu biblioteca está vacía.</strong><p>Crea un arma, habilidad o mejora para guardar configuraciones que puedas reutilizar.</p><button class="btn" id="component-new-empty">Crear primer componente</button></div>'}</section><section class="panel formpanel"><div class="panelhead"><div><h3>${current?'Editar componente':'Crear componente'}</h3><p>Completa los campos y guarda tu fragmento.</p></div></div><form id="component-form"><label class="field">Tipo de componente<select name="kind" id="component-kind"><option value="weapon" ${x.kind==='weapon'?'selected':''}>Arma</option><option value="ability" ${x.kind==='ability'?'selected':''}>Habilidad</option><option value="upgrade" ${x.kind==='upgrade'?'selected':''}>Mejora tecnológica</option><option value="snippet" ${x.kind==='snippet'?'selected':''}>Otro fragmento</option></select><small>Selecciona qué estás diseñando.</small></label><label class="field">Nombre<input name="name" required maxlength="70" value="${esc(x.name)}" placeholder="Ejemplo: Cañón pesado"></label><label class="field">Identificador<input name="id" id="component-id" required pattern="[A-Za-z0-9_]+" maxlength="48" value="${esc(x.id)}" placeholder="canon_pesado"></label><label class="field">Añadir a<select name="target"><option value="">Guardar sin asignar</option>${targets.map(t=>`<option value="${esc(t.id)}" ${x.target===t.id?'selected':''}>${t._type}: ${esc(t.name)}</option>`).join('')}</select><small>Puedes cambiar el destino más adelante.</small></label><label class="field">¿Qué hace?<textarea name="description" maxlength="350" placeholder="Describe su propósito y comportamiento.">${esc(x.description)}</textarea></label><label class="field">Fragmento de configuración<textarea name="config" id="component-config" spellcheck="false" style="min-height:190px;font:11px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace" placeholder="# Escribe aquí las secciones y claves INI necesarias.">${esc(x.config||componentTemplate(x.kind,x.id))}</textarea><small>Este contenido se puede insertar en el INI del elemento seleccionado.</small></label><div class="toolrow"><button type="submit" class="btn">Guardar componente</button><button type="button" class="btn secondary" id="component-apply-save">Guardar e insertar</button><button type="button" class="btn ghost" id="component-cancel">Cancelar</button></div></form></section></div><div class="note"><strong>Ideas para ampliar el mod:</strong> crea perfiles de armas para cada clase de unidad, habilidades especiales para unidades de apoyo, mejoras de blindaje o velocidad, y fragmentos comunes para edificios de una misma facción.</div>`}
function saveComponent(apply=false){const form=$('#component-form');if(!form||!form.reportValidity())return;const d=Object.fromEntries(new FormData(form));d.id=slug(d.id);d.kind=['weapon','ability','upgrade','snippet'].includes(d.kind)?d.kind:'snippet';if(!d.id){notify('El identificador no es válido.','bad');return}if(project.components.some(c=>c.id.toLowerCase()===d.id.toLowerCase()&&c.id!==componentEditingId)){notify('Ya existe un componente con ese identificador.','bad');return}const idx=project.components.findIndex(c=>c.id===componentEditingId);if(idx>=0)project.components[idx]=d;else project.components.push(d);componentEditingId=d.id;if(apply){if(!d.target){scheduleSave();render();notify('Componente guardado. Elige una unidad o edificio para insertarlo.','bad');return}applyComponent(d.id,true);return}scheduleSave();render();notify('Componente guardado en tu biblioteca.')}
function applyComponent(id,quiet=false){const c=project.components.find(x=>x.id===id);if(!c)return;const target=[...project.units,...project.buildings].find(x=>x.id===c.target);if(!target){notify('Edita el componente y selecciona una unidad o edificio.','bad');return}const fragment=String(c.config||'').trim();if(!fragment){notify('El componente no tiene contenido para insertar.','bad');return}const old=String(target.config||'').trim();if(old.includes(fragment)){if(!quiet)notify('Este fragmento ya está en la configuración del elemento.','bad');return}target.config=(old?old+'\n\n':'')+`# Componente insertado: ${c.name}\n`+fragment+'\n';scheduleSave();if(!quiet){render();notify(`«${c.name}» se insertó en ${target.name}. Revisa el INI antes de probarlo.`)}}
function deleteComponent(id){const c=project.components.find(x=>x.id===id);if(!c)return;if(!confirm(`¿Eliminar «${c.name}» de tu biblioteca? Los fragmentos ya insertados en otros INI no se borrarán.`))return;project.components=project.components.filter(x=>x.id!==id);if(componentEditingId===id)componentEditingId=null;scheduleSave();render();notify('Componente eliminado de la biblioteca.')}

function unitPresets(type){if(type==='units')return [{key:'constructor',label:'Constructor',category:'Constructor',hp:220,cost:150,mass:3000,radius:10,buildTime:'8s',description:'Unidad especializada en construcción y apoyo.'},{key:'recon',label:'Exploración',category:'Exploración',hp:150,cost:180,mass:1500,radius:8,buildTime:'6s',description:'Unidad ligera para explorar el mapa.'},{key:'infantry',label:'Infantería',category:'Infantería',hp:180,cost:120,mass:1200,radius:7,buildTime:'5s',description:'Unidad terrestre básica.'},{key:'light_vehicle',label:'Vehículo ligero',category:'Vehículo',hp:420,cost:350,mass:4500,radius:12,buildTime:'12s',description:'Vehículo rápido de combate.'},{key:'heavy_tank',label:'Tanque pesado',category:'Blindado pesado',hp:1100,cost:850,mass:9500,radius:17,buildTime:'25s',description:'Vehículo pesado con gran resistencia.'},{key:'artillery',label:'Artillería',category:'Artillería',hp:620,cost:700,mass:7000,radius:14,buildTime:'22s',description:'Unidad de apoyo de largo alcance.'},{key:'anti_air',label:'Defensa antiaérea',category:'Antiaéreo',hp:560,cost:620,mass:6000,radius:13,buildTime:'20s',description:'Unidad especializada contra amenazas aéreas.'},{key:'support',label:'Apoyo médico/logístico',category:'Apoyo',hp:500,cost:500,mass:5000,radius:12,buildTime:'16s',description:'Unidad de apoyo para otras fuerzas.'}];return [{key:'command',label:'Centro de mando',category:'Centro de mando',hp:2000,cost:1000,mass:10000,radius:20,buildTime:'35s',description:'Edificio central de la facción.'},{key:'power',label:'Generador',category:'Energía',hp:900,cost:450,mass:6000,radius:15,buildTime:'20s',description:'Instalación de producción o suministro.'},{key:'barracks',label:'Cuartel',category:'Producción de unidades',hp:1200,cost:750,mass:8000,radius:17,buildTime:'28s',description:'Edificio destinado a producir unidades.'},{key:'factory',label:'Fábrica',category:'Producción industrial',hp:1500,cost:950,mass:10000,radius:18,buildTime:'32s',description:'Instalación para producir vehículos.'},{key:'defense',label:'Torre defensiva',category:'Defensa',hp:1300,cost:600,mass:7500,radius:13,buildTime:'22s',description:'Estructura defensiva para proteger la zona.'},{key:'refinery',label:'Refinería',category:'Economía',hp:1000,cost:700,mass:7000,radius:15,buildTime:'25s',description:'Edificio dedicado a la producción económica.'},{key:'hospital',label:'Hospital',category:'Servicio',hp:1050,cost:650,mass:6500,radius:15,buildTime:'24s',description:'Edificio de apoyo y servicios.'}]} 
function renderModal(){const {type,id,old}=modal,x=old||defaults(type),factionOptions=project.factions.map(f=>`<option value="${esc(f.id)}" ${x.faction===f.id?'selected':''}>${esc(f.name)}</option>`).join('');const isFaction=type==='factions',presetOptions=type==='factions'?'':`<label class="field">Plantilla inicial<select id="item-preset"><option value="">Sin plantilla · configurar manualmente</option>${unitPresets(type).map(p=>`<option value="${esc(p.key)}">${esc(p.label)}</option>`).join('')}</select><small>Una plantilla rellena valores iniciales. Puedes modificarlos después.</small></label>`;return `<div class="modalback" id="modal-back" role="presentation"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modalhead"><div><div class="eyebrow">${old?'EDITAR':'CREAR'} CONTENIDO</div><h2 id="modal-title">${old?'Editar': 'Nuevo'} ${isFaction?'facción':type==='units'?'unidad':'edificio'}</h2></div><button class="close" id="modal-close" aria-label="Cerrar">×</button></div><form id="item-form"><div class="modalbody">${presetOptions}<div class="twocol"><label class="field">Nombre visible<input name="name" required maxlength="70" value="${esc(x.name)}" placeholder="Ejemplo: Tanque de reconocimiento"></label><label class="field">ID interno<input name="id" required pattern="[A-Za-z0-9_]+" maxlength="48" value="${esc(x.id)}" placeholder="tanque_recon"><small>Identificador técnico sin espacios.</small></label></div>${isFaction?`<div class="twocol"><label class="field">Color de la facción<input type="color" name="color" value="${esc(x.color)}"></label><label class="field">Créditos iniciales<input type="number" min="0" name="startingCredits" value="${num(x.startingCredits)}"></label></div><div class="twocol"><label class="field">Ingresos base<input type="number" min="0" step=".1" name="income" value="${num(x.income)}"></label><label class="field">Velocidad de construcción<input type="number" min=".1" max="5" step=".1" name="buildSpeed" value="${num(x.buildSpeed,1)}"></label></div><label class="field">Descripción<textarea name="description">${esc(x.description)}</textarea></label><label class="field">Ventajas<input name="strengths" value="${esc(x.strengths)}"></label><label class="field">Desventajas<input name="weaknesses" value="${esc(x.weaknesses)}"></label>`:`<div class="twocol"><label class="field">Facción<select name="faction" ${project.factions.length?'':'disabled'}>${factionOptions||'<option value="">Crea una facción primero</option>'}</select></label><label class="field">Tipo o especialidad<input name="category" value="${esc(x.category)}" maxlength="40" placeholder="Ejemplo: Blindado pesado"></label></div><div class="threecol"><label class="field">Salud máxima<input type="number" name="hp" min="1" step="1" value="${num(x.hp)}" required></label><label class="field">Coste en créditos<input type="number" name="cost" min="0" step="1" value="${num(x.cost)}" required></label><label class="field">Tiempo de construcción<input name="buildTime" value="${esc(x.buildTime)}" maxlength="20"></label></div><div class="threecol"><label class="field">Masa<input type="number" name="mass" min="0" value="${num(x.mass,3000)}"></label><label class="field">Radio<input type="number" name="radius" min="0" value="${num(x.radius,12)}"></label><label class="field">ID de facción<input value="${esc(x.faction)}" disabled></label></div><label class="field">Descripción<textarea name="description" placeholder="Describe qué hace este elemento.">${esc(x.description)}</textarea></label><div class="divider"></div><div class="panelhead"><div><h3>Configuración avanzada (INI)</h3><p>Este texto define detalles técnicos del elemento.</p></div><button class="btn secondary small" type="button" id="generate-ini">Crear plantilla básica</button></div><div class="helper-actions"><span>Insertar secciones:</span><button class="btn ghost small" type="button" data-ini-section="graphics">Imagen</button><button class="btn ghost small" type="button" data-ini-section="movement">Movimiento</button><button class="btn ghost small" type="button" data-ini-section="attack">Ataque</button><button class="btn ghost small" type="button" id="ini-check">Revisar INI</button></div><label class="field">Texto de configuración<textarea name="config" spellcheck="false" style="min-height:210px;font:11px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace">${esc(x.config||generatedIni(x,type))}</textarea><small>La plantilla es un punto de partida. Revisa las opciones en la documentación de la versión del juego que utilizas.</small></label>`}</div><div class="modalfoot"><button type="button" class="btn secondary" id="modal-cancel">Cancelar</button><button type="submit" class="btn">Guardar ${isFaction?'facción':'elemento'}</button></div></form></section></div>`}
function bindModal(){
 const close=()=>{modal=null;render()};
 $('#modal-close')?.addEventListener('click',close);
 $('#modal-cancel')?.addEventListener('click',close);
 $('#modal-back')?.addEventListener('click',e=>{if(e.target.id==='modal-back')close()});
 $('#generate-ini')?.addEventListener('click',()=>{const f=$('#item-form'),d=Object.fromEntries(new FormData(f));f.elements.config.value=generatedIni({...d,id:slug(d.id)},modal.type);notify('Plantilla creada. Completa las secciones necesarias.')});
 $('#item-preset')?.addEventListener('change',e=>{const preset=unitPresets(modal.type).find(x=>x.key===e.target.value);if(!preset)return;const f=$('#item-form');for(const k of ['category','hp','cost','mass','radius','buildTime','description'])if(f.elements[k])f.elements[k].value=preset[k];const d=Object.fromEntries(new FormData(f));f.elements.config.value=generatedIni({...d,id:slug(d.id)},modal.type);notify(`Plantilla «${preset.label}» aplicada. Puedes ajustar todos los valores.`)});
 $$('[data-ini-section]').forEach(b=>b.addEventListener('click',()=>{const f=$('#item-form'),field=f?.elements.config;if(!field)return;const name=b.dataset.iniSection;if(parseIni(field.value).sections[name]){notify(`La sección [${name}] ya existe.`,'bad');return}const hints={graphics:'# Añade aquí la ruta de la imagen, por ejemplo: image: sprites/mi_unidad.png',movement:'# Configura aquí el tipo de movimiento y la velocidad.',attack:'# Configura aquí las opciones de ataque compatibles con el juego.'};field.value=field.value.trimEnd()+`

[${name}]
${hints[name]}
`;field.focus()}));
 $('#ini-check')?.addEventListener('click',()=>{const text=$('#item-form')?.elements.config?.value||'',parsed=parseIni(text),notes=[];if(!parsed.sections.core)notes.push('Falta [core].');if(parsed.dups.length)notes.push(`${parsed.dups.length} sección(es) o clave(s) duplicada(s).`);if(!parsed.sections.graphics)notes.push('No aparece [graphics].');if(!parsed.sections.movement)notes.push('No aparece [movement].');notify(notes.length?notes.join(' '):`Se encontraron ${Object.keys(parsed.sections).length} secciones y no hay duplicados detectados.`,notes.length?'bad':'good')});
 $('#item-form')?.addEventListener('submit',e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.currentTarget));data.id=slug(data.id);if(!data.id){notify('El identificador no es válido.','bad');return}const list=project[modal.type];if(list.some(x=>x.id.toLowerCase()===data.id.toLowerCase()&&x.id!==modal.id)){notify('Ya existe un elemento con ese identificador.','bad');return}if(modal.type==='factions'){for(const k of ['startingCredits','income','buildSpeed'])data[k]=num(data[k])}else{for(const k of ['hp','cost','mass','radius'])data[k]=num(data[k]);if(modal.type==='buildings')data.isBuilding=true}const oldId=modal.id;if(oldId){const i=list.findIndex(x=>x.id===oldId);if(i>=0)list[i]=data;if(modal.type==='factions'&&oldId!==data.id){for(const key of ['units','buildings'])project[key].forEach(v=>{if(v.faction===oldId)v.faction=data.id})}}else list.push(data);modal=null;scheduleSave();render();notify('Cambios guardados.')});
 $('#modal-title')?.focus()

function deleteItem(type,id){const list=project[type],item=list.find(x=>x.id===id);if(!item)return;if(type==='factions'&&[...project.units,...project.buildings].some(x=>x.faction===id)){notify('No puedes borrar una facción utilizada por unidades o edificios. Reasigna primero sus elementos.','bad');return}if(!confirm(`¿Eliminar "${item.name}"? Esta acción no se puede deshacer.`))return;project[type]=list.filter(x=>x.id!==id);scheduleSave();render();notify('Elemento eliminado.')}
function safePath(path){let p=String(path||'').replace(/\\/g,'/').replace(/^\/+/, '').replace(/\/+/g,'/');const parts=p.split('/');if(!p||/^[a-z]:/i.test(p)||p.includes(':')||p.includes(String.fromCharCode(0))||parts.some(x=>!x||x==='.'||x==='..'))throw Error('La ruta del archivo no es segura. Usa carpetas relativas, por ejemplo: sprites/unidad.png.');return p}
async function addAssets(fileList){const files=[...fileList];if(!files.length)return;let added=0;for(const file of files){if(file.size>25*1024*1024){notify(`${file.name}: supera el límite de 25 MB.`,'bad');continue}const path=safePath(file.webkitRelativePath||file.name);if(project.assets.some(a=>a.path.toLowerCase()===path.toLowerCase())){notify(`${path}: ya existe en la biblioteca.`,'bad');continue}const total=project.assets.reduce((n,a)=>n+num(a.size),0);if(total+file.size>200*1024*1024){notify('La biblioteca alcanzó el límite recomendado de 200 MB. Añade menos archivos o reduce su tamaño.','bad');break}const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(file)});project.assets.push({path,data,type:file.type||'application/octet-stream',size:file.size});added++}if(added){scheduleSave();render();notify(`${added} archivo(s) añadido(s).`)}if($('#asset-files'))$('#asset-files').value='';if($('#asset-folder-files'))$('#asset-folder-files').value=''}
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}

function dataUrlBytes(data){const i=data.indexOf(',');if(i<0)throw Error('Datos de recurso inválidos');const bin=atob(data.slice(i+1)),out=new Uint8Array(bin.length);for(let j=0;j<bin.length;j++)out[j]=bin.charCodeAt(j);return out}
const encoder=new TextEncoder();
const crcTable=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xedb88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(bytes){let c=0xffffffff;for(const b of bytes)c=crcTable[(c^b)&255]^(c>>>8);return(c^0xffffffff)>>>0}
function u16(v){return[v&255,(v>>>8)&255]}function u32(v){return[v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255]}
function concatBytes(chunks){const length=chunks.reduce((n,x)=>n+x.length,0),out=new Uint8Array(length);let offset=0;for(const x of chunks){out.set(x,offset);offset+=x.length}return out}
function dosDate(){const d=new Date(),year=Math.max(1980,d.getFullYear());return{time:(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),date:((year-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate()}}
function zipStore(entries){
 if(!Array.isArray(entries)||entries.length>65535)throw Error('El paquete contiene demasiados archivos para este formato ZIP.');
 const local=[],central=[],seen=new Set();let offset=0;const dt=dosDate();
 for(const entry of entries){
  const safe=safePath(entry.name),key=safe.toLowerCase();if(seen.has(key))throw Error(`Hay dos archivos con la misma ruta: ${safe}`);seen.add(key);
  const name=encoder.encode(safe),data=entry.data instanceof Uint8Array?entry.data:encoder.encode(String(entry.data));
  if(name.length>65535||data.length>0xffffffff||offset+data.length>0xffffffff)throw Error('El paquete supera los límites del formato ZIP clásico.');
  const crc=crc32(data),header=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(dt.time),...u16(dt.date),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0)]),chunk=concatBytes([header,name,data]);
  local.push(chunk);
  const c=new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(dt.time),...u16(dt.date),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(offset)]);
  central.push(concatBytes([c,name]));offset+=chunk.length;

 return concatBytes([...local,centralBytes,end]);
}
function generatedModInfo(){const clean=s=>String(s||'').replace(/[\r\n]/g,' ').trim();return `[mod]\ntitle: ${clean(project.meta.name)}\ndescription: ${clean(project.meta.description)}\n`}
function exportRwmod(){try{const entries=[{name:'mod-info.txt',data:generatedModInfo()}];const all=[...project.units,...project.buildings];for(const x of all){const config=String(x.config||'').trim()||generatedIni(x,x.isBuilding?'buildings':'units');const text=config.endsWith('\n')?config:config+'\n';entries.push({name:`units/${slug(x.id)}.ini`,data:text})}for(const sp of Object.values(project.sprites||{})){const path=safePath(sp.path||`sprites/${slug(sp.id)}.png`);entries.push({name:path,data:dataUrlBytes(sp.data)})}for(const a of project.assets){const path=safePath(a.path);if(path.toLowerCase()==='mod-info.txt'||path.toLowerCase().startsWith('units/')&&path.toLowerCase().endsWith('.ini'))throw Error(`El recurso ${path} usa una ruta reservada por el paquete.`);entries.push({name:`${path}`,data:dataUrlBytes(a.data)})}const zip=zipStore(entries);download(new Blob([zip],{type:'application/zip'}),`${slug(project.meta.id)||'mod'}.rwmod`);notify('Paquete .rwmod generado.')}catch(e){notify(`No se pudo crear el paquete: ${e.message}`,'bad')}}
function parseZip(bytes){
 if(!(bytes instanceof Uint8Array)||bytes.length<22)throw Error('El archivo no parece ser un paquete ZIP válido.');

 for(let i=bytes.length-22;i>=Math.max(0,bytes.length-65558);i--){if(view.getUint32(i,true)===0x06054b50){eocd=i;break}}
 if(eocd<0||eocd+22>bytes.length)throw Error('No se encontró el directorio ZIP.');
 const disk=view.getUint16(eocd+4,true),cdDisk=view.getUint16(eocd+6,true),diskCount=view.getUint16(eocd+8,true),count=view.getUint16(eocd+10,true),cdSize=view.getUint32(eocd+12,true),cdOffset=view.getUint32(eocd+16,true),comment=view.getUint16(eocd+20,true);
 if(disk||cdDisk||diskCount!==count)throw Error('No se admiten paquetes ZIP divididos en varias partes.');
 if(count===0xffff||cdSize===0xffffffff||cdOffset===0xffffffff)throw Error('Este paquete utiliza ZIP64, que todavía no es compatible.');
 if(count>5000)throw Error('El paquete contiene demasiados archivos.');
 if(eocd+22+comment>bytes.length||cdOffset+cdSize>eocd)throw Error('El directorio del paquete está incompleto o dañado.');
 let p=cdOffset,totalUncompressed=0;const files=[],seen=new Set();
